# 「今日のみちよ」の自動更新 + LINE配信
#
#  朝の便  : today/today.json を今日の内容に更新 → コミット → LINEに朝の1通(broadcast)
#  見張り便: YouTubeの予定ライブを見張り、新しい予約があれば LINEに1通(1ライブ1回・notified_live で管理)
#
#  ■ 届く仕組み(2026-10-12に作り直し。10/12朝、GitHubの6:50起動が丸ごと飛んで未配信になったため)
#   1. 起動のきっかけを増やす: 6:50 / 7:10 / 7:25 / 7:45 / 8:05 JST と、毎時07分。GitHubの定時実行は遅れたり飛んだりする。
#   2. どのきっかけで起動しても、「today.json の date が今日より前」かつ「6:45 JST 以降」なら朝の便として動く。
#      朝の便が済むと date が今日になるので、同じ日に二度は送らない。送れなかった日は次の便が自動でやり直す。
#   3. LINE送信は X-Line-Retry-Key(その日付から作る固定の鍵)付きで最大4回まで再送。万一やり直しで同じ便を
#      送っても、LINE側が同じ鍵として1通にまとめる(二重配信にならない)。
#   4. checkout は常に main の最新(ref: main)。順番待ちの便が古い today.json を見て二重送信するのを防ぐ。
#
#  LINEの鍵は Settings → Secrets and variables → Actions → LINE_CHANNEL_TOKEN。無い間は文面を出すだけ(送らない)。
#  手動実行: Actions タブ → today → Run workflow → mode = morning(朝の便) / live(見張り便) / test(送らずに文面確認)
name: today

on:
  schedule:
    - cron: "50 21 * * *"   # 06:50 JST 朝の便(本命。今日のブログが出るまで最大7:30まで待つ)
    - cron: "10 22 * * *"   # 07:10 JST 保険1
    - cron: "25 22 * * *"   # 07:25 JST 保険2
    - cron: "45 22 * * *"   # 07:45 JST 保険3
    - cron: "5 23 * * *"    # 08:05 JST 保険4
    - cron: "7 * * * *"     # 毎時07分 見張り便(朝の便がまだなら朝の便として動く)
  workflow_dispatch:
    inputs:
      mode:
        description: "morning(朝の便) / live(見張り便) / test(送らずに文面だけ確認)"
        default: "morning"

permissions:
  contents: write

concurrency:
  group: today
  cancel-in-progress: false

jobs:
  today:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 順番待ちの間に進んだ最新の today.json を必ず見る

      - name: どちらの便か決める
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ github.event.inputs.mode }}"
            echo "手動実行: $mode"
          else
            mode=$(python3 - <<'PY'
          import json, datetime
          jst = datetime.timezone(datetime.timedelta(hours=9))
          now = datetime.datetime.now(jst)
          try:
              last = json.load(open("today/today.json", encoding="utf-8")).get("date", "")
          except Exception:
              last = ""
          today = now.strftime("%Y-%m-%d")
          morning = last < today and (now.hour, now.minute) >= (6, 45)
          print("morning" if morning else "live")
          print(f"today.json の date={last!r} / 今日={today} / 現在 {now:%H:%M} JST → {'朝の便' if morning else '見張り便'}", file=__import__('sys').stderr)
          PY
          )
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "mode=$mode"

      - name: 朝の更新(today.json)
        if: steps.mode.outputs.mode == 'morning'
        run: python3 scripts/update_today.py

      - name: ライブ見張り
        if: steps.mode.outputs.mode == 'live'
        run: python3 scripts/update_today.py --live

      - name: LINEに送る
        if: steps.mode.outputs.mode == 'morning' || steps.mode.outputs.mode == 'live'
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
        run: python3 scripts/line_push.py ${{ steps.mode.outputs.mode }}

      - name: 変更があればコミット
        if: steps.mode.outputs.mode == 'morning' || steps.mode.outputs.mode == 'live'
        run: |
          rm -f today/fresh_live.json
          git config user.name "today-bot"
          git config user.email "today-bot@users.noreply.github.com"
          git add today/today.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "today: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') ${{ steps.mode.outputs.mode }} [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push に失敗($i回目)。15秒待って再試行"; sleep 15
            done
          fi

      # ---- test: 送らずに、今日の文面と判定結果だけ確認する(today.json は書き換えず、結果は today/last_test.txt に残す) ----
      - name: テスト(送らずに文面を確認)
        if: steps.mode.outputs.mode == 'test'
        env:
          TODAY_NO_WAIT: "1"
        run: |
          {
            echo "テスト実行: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') JST(送信していません)"
            echo "===== 今日の today.json ====="
            python3 scripts/update_today.py 2>&1
            cat today/today.json
            echo "===== 朝の1通(ドライラン・送信しない) ====="
            python3 scripts/line_push.py morning 2>&1
          } | tee today/last_test.txt
          cat today/last_test.txt >> "$GITHUB_STEP_SUMMARY"
          git checkout -- today/today.json
          rm -f today/fresh_live.json
          git config user.name "today-bot"
          git config user.email "today-bot@users.noreply.github.com"
          git add today/last_test.txt
          git commit -m "today: テスト結果 [skip ci]" || true
          git pull --rebase origin main && git push || true
