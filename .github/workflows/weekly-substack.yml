name: 今週のメルマガ欄を更新(Substack)

on:
  schedule:
    # 毎週土曜 9:30 と 12:30 (日本時間) = 土曜 00:30 / 03:30 UTC。配信(土曜8:00)の後に2回試す
    - cron: "30 0 * * 6"
    - cron: "30 3 * * 6"
  workflow_dispatch: {}   # 手動でも実行できる(Actionsタブ → Run workflow)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Substackの最新記事で WEEKLY を書き換える
        run: python3 scripts/update_weekly.py index.html
      - name: 変更があればコミットして公開
        run: |
          git config user.name "weekly-substack-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then echo "変更なし"; exit 0; fi
          git add index.html
          git commit -m "今週のメルマガ欄を更新 ($(date -u +%Y-%m-%d))"
          git push
