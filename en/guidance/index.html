<style>
:root{
  --ground:#F6F1EB; --paper:#FFFDFA; --paper-2:#FBF7F2; --ink:#453F3C; --ink-soft:#7A716C; --ink-faint:#A69C96;
  --line:#E7DDD3; --water:#7FA6B8; --water-deep:#4E7A8E; --water-mist:#DCE8ED;
  --cover:#22414b; --cover-2:#132a32; --gold:#d9bf7a; --gold-2:#f1dea6; --gold-dim:rgba(217,191,122,.55); --shadow:rgba(20,35,42,.45); --focus:#4E7A8E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#181F23; --paper:#232B30; --paper-2:#1F272B; --ink:#EAE3DC; --ink-soft:#B9AFA7; --ink-faint:#877D76;
    --line:#35403F; --water:#8FB6C7; --water-deep:#A9CCDA; --water-mist:#25353C;
    --cover:#1c353d; --cover-2:#0f2128; --shadow:rgba(0,0,0,.6); --focus:#A9CCDA;
  }
}
:root[data-theme="dark"]{
  --ground:#181F23; --paper:#232B30; --paper-2:#1F272B; --ink:#EAE3DC; --ink-soft:#B9AFA7; --ink-faint:#877D76;
  --line:#35403F; --water:#8FB6C7; --water-deep:#A9CCDA; --water-mist:#25353C;
  --cover:#1c353d; --cover-2:#0f2128; --shadow:rgba(0,0,0,.6); --focus:#A9CCDA;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.9;letter-spacing:.02em;min-height:100vh;overflow-x:hidden;position:relative}
#water{position:fixed;top:-60px;left:-60px;width:calc(100% + 120px);height:calc(100% + 120px);z-index:0;pointer-events:none;filter:blur(20px);opacity:.9}
.mincho{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:40px 18px 70px}
.top{font-family:"Shippori Mincho",serif;font-size:11px;letter-spacing:.36em;color:var(--ink-faint);text-align:center;margin:0 0 18px}

/* ===== the book ===== */
.book{position:relative;perspective:2200px;margin:0 auto;max-width:940px}
/* cover ── 叡智の詰まった古い哲学書: 深い藍緑の革、金箔の二重罫と隅飾り、背の畝、金の小口 */
.cover{position:relative;margin:0 auto;width:min(440px,100%);aspect-ratio:3/4.1;
  background:
    radial-gradient(ellipse at 30% 18%, rgba(255,255,255,.10), rgba(255,255,255,0) 55%),
    radial-gradient(ellipse at 80% 90%, rgba(0,0,0,.28), rgba(0,0,0,0) 60%),
    repeating-radial-gradient(circle at 20% 30%, rgba(255,255,255,.028) 0 1px, rgba(0,0,0,0) 1px 4px),
    repeating-radial-gradient(circle at 70% 60%, rgba(0,0,0,.05) 0 1px, rgba(0,0,0,0) 1px 5px),
    linear-gradient(160deg,var(--cover) 0%,var(--cover-2) 100%);
  border-radius:3px 12px 12px 3px;
  box-shadow:0 30px 60px -22px var(--shadow), 0 1px 0 rgba(255,255,255,.12) inset,
    /* 金の小口(右側の紙の束) */ 4px 0 0 -1px #e9d9a8, 7px 0 0 -2px #d9c68a, 10px 0 0 -3px #c9b273,
    /* 背 */ -7px 0 0 -3px var(--cover-2), -12px 0 0 -6px #0b181d;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:44px 34px 34px;cursor:pointer;
  transform-origin:left center;transition:transform 1s cubic-bezier(.4,.05,.2,1),opacity .9s ease;border:0;font:inherit;color:var(--gold-2)}
/* 背の畝(左端の縞) */
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;border-radius:3px 0 0 3px;
  background:linear-gradient(90deg, rgba(0,0,0,.35), rgba(0,0,0,.05) 60%, rgba(255,255,255,.06)),
    repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 11%, rgba(217,191,122,.55) 11% 11.4%, rgba(0,0,0,0) 11.4% 12.2%, rgba(217,191,122,.55) 12.2% 12.6%, rgba(0,0,0,0) 12.6% 25%)}
/* 金箔の二重罫 */
.cover::after{content:"";position:absolute;inset:16px 16px 16px 34px;border:1.5px solid var(--gold-dim);border-radius:2px 8px 8px 2px;pointer-events:none;
  outline:1px solid rgba(217,191,122,.28);outline-offset:4px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
/* 四隅の飾り(小さな金の菱) */
.cover .corner{position:absolute;width:14px;height:14px;pointer-events:none;color:var(--gold)}
.cover .corner::before,.cover .corner::after{content:"";position:absolute;inset:0;border:1px solid currentColor;transform:rotate(45deg);opacity:.8}
.cover .corner::after{inset:4px;background:currentColor;opacity:.55}
.cover .c1{top:27px;left:45px}.cover .c2{top:27px;right:27px}.cover .c3{bottom:27px;left:45px}.cover .c4{bottom:27px;right:27px}
/* 紋章(フラワー・オブ・ライフ)を金で */
.cover .emblem{width:64px;height:64px;color:var(--gold);opacity:.95;margin:0 0 22px;filter:drop-shadow(0 0 6px rgba(217,191,122,.35))}
.cover .eyebrow{font-family:"Shippori Mincho",serif;font-size:10.5px;letter-spacing:.42em;text-indent:.42em;color:var(--gold-dim);margin-bottom:20px}
.cover h1{font-family:"Shippori Mincho",serif;font-weight:600;font-size:clamp(27px,5.2vw,34px);letter-spacing:.22em;margin:0 0 14px;line-height:1.7;color:var(--gold-2);
  text-shadow:0 1px 0 rgba(0,0,0,.35),0 0 18px rgba(217,191,122,.25)}
.cover .rule{width:120px;height:1px;background:linear-gradient(90deg,rgba(217,191,122,0),var(--gold),rgba(217,191,122,0));margin:4px 0 14px}
.cover .sub{font-family:"Shippori Mincho",serif;font-size:13px;color:var(--gold);letter-spacing:.2em;line-height:2;margin:0;opacity:.9}
.cover .latin{font-family:"Shippori Mincho",Georgia,serif;font-size:9.5px;letter-spacing:.34em;text-indent:.34em;color:var(--gold-dim);margin-top:30px;text-transform:uppercase}
.cover .open{margin-top:auto;font-family:"Shippori Mincho",serif;font-size:12px;letter-spacing:.36em;text-indent:.36em;color:var(--gold);display:flex;flex-direction:column;align-items:center;gap:10px;opacity:.9}
.cover .open::after{content:"";width:1px;height:26px;background:var(--gold);opacity:.6;animation:drop 2.4s ease-in-out infinite}
.cover:hover{transform:rotateY(-6deg)}
.cover:hover .emblem{filter:drop-shadow(0 0 12px rgba(241,222,166,.6))}
.cover:focus-visible{outline:2px solid var(--focus);outline-offset:6px}
.book.opened .cover{transform:rotateY(-95deg);opacity:0;pointer-events:none;position:absolute;left:50%;top:0}
/* spread */
.spread{display:none;grid-template-columns:1fr 1fr;position:relative;background:var(--paper);border-radius:6px;box-shadow:0 30px 60px -28px var(--shadow),0 1px 0 var(--line)}
.book.opened .spread{display:grid;animation:reveal 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes reveal{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.spread::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:60px;margin-left:-30px;background:linear-gradient(90deg,transparent 0,rgba(70,50,30,.06) 45%,rgba(70,50,30,.10) 50%,rgba(70,50,30,.06) 55%,transparent 100%);pointer-events:none;z-index:2}
.page{position:relative;padding:44px 44px 40px;min-height:560px;display:flex;flex-direction:column;background:var(--paper)}
.page.l{border-radius:6px 0 0 6px;box-shadow:inset -1px 0 0 var(--line)}
.page.r{border-radius:0 6px 6px 0}
.page::after{content:attr(data-folio);position:absolute;bottom:16px;font-family:"Shippori Mincho",serif;font-size:10.5px;letter-spacing:.24em;color:var(--ink-faint)}
.page.l::after{left:44px}.page.r::after{right:44px}
/* page turn */
.page.turn{animation:turn .85s cubic-bezier(.3,.1,.2,1) both;transform-origin:left center}
.page.l.turn{animation-name:turnL;transform-origin:right center}
@keyframes turn{from{transform:rotateY(-24deg);opacity:0;box-shadow:-30px 0 40px -30px var(--shadow)}to{transform:none;opacity:1}}
@keyframes turnL{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.page.turn,.book.opened .spread,.cover,.cover .open::after{animation:none;transition:none}}
/* page typography */
.kicker{font-family:"Shippori Mincho",serif;font-size:11.5px;letter-spacing:.3em;color:var(--water-deep);margin:0 0 18px;display:flex;align-items:center;gap:12px}
.kicker::after{content:"";flex:1;height:1px;background:var(--line)}
.ptitle{font-family:"Shippori Mincho",serif;font-weight:500;font-size:22px;letter-spacing:.14em;margin:0 0 10px;line-height:1.6;text-wrap:balance}
.plead{font-size:13.5px;color:var(--ink-soft);line-height:2;margin:0 0 22px;max-width:28em}
.toc{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.toc button{appearance:none;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);text-align:left;font:inherit;color:var(--ink);cursor:pointer;padding:13px 26px 13px 0;position:relative;display:grid;grid-template-columns:1fr;row-gap:2px;transition:color .3s,padding-left .4s cubic-bezier(.2,.7,.2,1)}
.toc .name{font-family:"Shippori Mincho",serif;font-size:16px;letter-spacing:.08em;line-height:1.5}
.toc .hint{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.6}
.toc button::after{content:"";position:absolute;right:8px;top:50%;width:6px;height:6px;margin-top:-4px;border-top:1px solid var(--ink-faint);border-right:1px solid var(--ink-faint);transform:rotate(45deg);transition:border-color .3s,right .4s}
.toc button:hover,.toc button:focus-visible{color:var(--water-deep);padding-left:8px;outline:none}
.toc button:hover::after,.toc button:focus-visible::after{border-color:var(--water-deep);right:4px}
.toc.items button{padding:15px 26px 15px 0}
.toc.items .name{font-family:inherit;font-size:15px;letter-spacing:.03em;line-height:1.7}
.textlink{appearance:none;background:transparent;border:0;padding:6px 2px;color:var(--ink-soft);font:inherit;font-family:"Shippori Mincho",serif;font-size:13px;letter-spacing:.12em;cursor:pointer;border-bottom:1px solid var(--line);transition:color .3s,border-color .3s}
.textlink:hover,.textlink:focus-visible{color:var(--water-deep);border-bottom-color:var(--water);outline:none}
.links{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:auto;padding-top:26px}
.src+.links{margin-top:0;padding-top:22px}
.back{appearance:none;background:transparent;border:0;color:var(--ink-faint);font:inherit;font-family:"Shippori Mincho",serif;font-size:12.5px;letter-spacing:.12em;cursor:pointer;padding:0;margin:0 0 22px;align-self:flex-start}
.back:hover,.back:focus-visible{color:var(--water-deep);outline:none}
/* answer pages */
.chosen{border-left:1px solid var(--water);padding-left:16px;margin:0 0 24px}
.chosen .lab{font-size:11px;letter-spacing:.24em;color:var(--ink-faint);margin:0 0 4px}
.chosen .q{font-family:"Shippori Mincho",serif;font-size:15px;color:var(--ink-soft);margin:0;line-height:1.8}
.hitokoto{font-family:"Shippori Mincho",serif;font-size:21px;font-weight:500;letter-spacing:.1em;line-height:1.75;margin:0 0 28px;padding-bottom:22px;border-bottom:1px solid var(--line);text-wrap:balance}
.body{font-size:14.5px;line-height:2.05;margin:0}
.body p{margin:0 0 1.35em}
.body p:last-child{margin-bottom:0}
.sign{font-family:"Shippori Mincho",serif;color:var(--ink-soft);font-size:13px;letter-spacing:.16em;margin:8px 0 0;text-align:right}
.toi-wrap{margin:auto 0;padding:10px 0 40px}
.toi-text{font-family:"Shippori Mincho",serif;font-size:20px;line-height:2.05;letter-spacing:.08em;margin:0 0 20px;text-wrap:balance}
.toi-after{font-size:12.5px;color:var(--ink-soft);line-height:2;margin:0}
.src{margin:auto 0 0;padding-top:18px;border-top:1px solid var(--line)}
.src h3{font-family:"Shippori Mincho",serif;font-size:11px;letter-spacing:.26em;color:var(--ink-faint);margin:0 0 8px;font-weight:400}
.src ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.src li{font-size:11.5px;color:var(--ink-soft);line-height:1.7}
.src li span{color:var(--ink-faint);font-variant-numeric:tabular-nums}
/* footer */
footer{max-width:720px;margin:56px auto 0;padding-top:24px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);line-height:2}
footer p{margin:0 0 12px}
footer .about{color:var(--ink);font-size:13px}
footer a{color:var(--water-deep);text-decoration:none;border-bottom:1px solid var(--water-mist)}
.help{font-size:12px;color:var(--ink-faint)}
.foot-links{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:6px}
.copy{font-family:"Shippori Mincho",serif;font-size:11px;letter-spacing:.2em;color:var(--ink-faint);margin-top:22px;text-align:center}
/* mobile: pages stack */
@media (max-width:720px){
  .wrap{padding:28px 12px 60px}
  .spread{grid-template-columns:1fr}
  .spread::before{display:none}
  .page{padding:34px 26px 34px;min-height:0}
  .page.l{border-radius:6px 6px 0 0;box-shadow:inset 0 -1px 0 var(--line)}
  .page.r{border-radius:0 0 6px 6px}
  .page.turn{animation-name:slide}
  @keyframes slide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
  .page::after{bottom:12px}
  .book.opened .cover{display:none}
}
</style>

  "answers": {
    "q001": {
      "hitokoto": "The fear of being disliked can be an invitation to love yourself",
      "body": "Many people know the pain of being unable to say what they want because they fear being disliked.\n\nThat desperate wish to be liked may have less to do with others than with a moment when you do not like yourself. Without your own acceptance, you seek reassurance through someone else’s affection.\n\nYet people who are naturally liked are not always trying to be liked. Their unforced honesty puts others at ease.\n\nSharing an honest feeling is like offering a little introduction: this is who I am. Today, try putting just one thought into words.",
      "toi": "Behind I cannot say it, is there someone who might dislike you, or a part of you that dislikes yourself? Look gently for a moment.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-08-18",
          "title": "The fear of being disliked is a sign to love yourself",
          "id": "20240818_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-02-14",
          "title": "People who are naturally liked are not trying to be liked",
          "id": "20250214_01"

          "date": "2026-01-08",
          "title": "You can express your feelings honestly without being disliked",
          "id": "20260108_01"
        }
      ]
    },
    "q002": {
      "hitokoto": "People who trouble you can mirror your inner world",
      "body": "Difficult relationships at work are among the most common concerns people bring to me.\n\nA workplace gathers people of different ages and backgrounds around the shared interests of work. What lingers is often less the work itself than a collision of wishes to be understood.\n\nSomeone who troubles you can also be a mirror of your inner world. The more you suppress yourself with I must not say what I think, the more you may notice someone who speaks without restraint.\n\nToday, try looking at one person with the question: what might they be afraid of? The view may change before you ever try to change them.",
      "toi": "What might it mean to share this place with these people now? What within you is being stirred through them?",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-06-09",
          "title": "What to know when workplace relationships hurt",
          "id": "20240609_01"
        },

          "title": "Workplace relationships are both cool and messy",
          "id": "20241017_01"

          "title": "What happens when you face the pain of relationships",
          "id": "20260512_01"
        }

    },
    "q003": {
      "hitokoto": "Something of yourself lives within that discomfort",
      "body": "Sometimes the person you want to avoid keeps appearing before you. Avoiding them may leave the relationship unchanged, or make it more tangled.\n\nAsk yourself why this person feels so difficult. As you put the heart’s small responses into words, you might discover something like: they openly do what I will not let myself do.\n\nWhat troubles you can conceal something you truly want, or something you have held back. The feeling may not be created by the other person; something already within you is being touched.",
      "toi": "What about this person catches you most? Something you have made yourself endure may be waiting there.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-11-11",
          "title": "A way to stop attracting people you find difficult",
          "id": "20251111_02"
        },
        {
          "media": "Ameblo blog · Japanese source",

          "title": "The real you reflected in someone you dislike",
          "id": "20250529_01"
        },
        {

          "date": "2026-02-28",
          "title": "Noticing what lies beyond dislike can help you like yourself",
          "id": "20260228_02"
        }

    },
    "q004": {
      "hitokoto": "Say yes to your own judgement",
      "body": "You may find it hard to refuse because you do not want to hurt someone, seem unkind, or damage a relationship.\n\nBut a connection that requires you to endure what you do not want is not a true bond. A relationship that breaks because of a no may not have been the connection you believed it was.\n\nWhen you cannot say yes to your own no, it is harder for that no to reach the other person. No is a positive statement of intention that protects your comfort and boundaries.\n\nOffer acceptance to your own judgement. Today, make one small decision by asking what you want.",
      "toi": "Does this yes come from desire, or from fear of being disliked? Simply notice the difference.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-09-13",
          "title": "Saying yes to your judgement helps you say no to others",
          "id": "20240913_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-02-27",
          "title": "Learning to say no restores energy",
          "id": "20240227_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-01-31",
          "title": "Protecting your boundaries: you may say no",
          "id": "20250131_02"
        }
      ]
    },
    "q005": {
      "hitokoto": "The person who needs your care now is you",
      "body": "Feeling tossed about by someone’s mood may come from your sensitivity. You read their energy first, put them before yourself, and find you have pushed too hard.\n\nAt such times, the person who most needs your care may be you. Bringing energy back within strengthens your foundation and makes it harder for others to carry your attention away.\n\nLet feelings move instead of storing them up: writing in a notebook or singing karaoke can help. Sensitivity is one of your qualities, not something to hate. Welcoming it can gradually make life easier.",
      "toi": "How do I feel right now? Before reading the other person’s face, look at your own once.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-11-19",
          "title": "When you absorb too much influence from others",
          "id": "20241119_02"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-05-14",
          "title": "How not to be pulled into someone’s negative remarks",
          "id": "20240514_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-06-22",
          "title": "Loving your sensitivity makes life easier",
          "id": "20250622_01"
        }
      ]
    },
    "q006": {
      "hitokoto": "Strong expectations may reveal a part of you that is depleted",
      "body": "Many of us have felt let down after hoping someone would act as we expected.\n\nWe may lean heavily on expectations when we have partly stopped taking care of our own happiness: please notice what I need; please make my wishes come true. When we are depleted in this way, disappointment hurts all the more.\n\nOther people cannot always act as we imagine. Today, turn kindness towards the part of you so worn down that it needs to expect so much. As your strength returns, someone else’s response may shake you less.",
      "toi": "Perhaps this expectation is something you wanted to offer yourself. Who was the wish really meant for?",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-10-30",
          "title": "What to consider when expectations leave you feeling betrayed",
          "id": "20251030_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-03-27",
          "title": "What to notice when you feel someone has hurt you",
          "id": "20260327_01"
        }
      ]
    },
    "q007": {
      "hitokoto": "The pain may come from inferiority, rather than comparison itself",
      "body": "They have come so far, and I am still here: anyone can feel this. Comparison itself is not bad; we can learn from others. The pain may arise because we are looking through a sense of inferiority.\n\nThe people you compare yourself with also have struggles you cannot see. The life you imagine may be an illusion.\n\nWhile comparing, your attention is outside yourself. As you watch someone else’s garden, your own goes unwatered. Today, sit gently beside the part of you that feels discouraged.",
      "toi": "Whose garden would you like to water now? What does this sadness really long for?",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-09-29",
          "title": "When comparing yourself with others hurts",
          "id": "20240929_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-10-24",
          "title": "When comparing your life with someone else becomes painful",
          "id": "20251024_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-04-25",
          "title": "What becomes visible when you stop comparing",
          "id": "20260425_01"
        }
      ]
    },
    "q008": {
      "hitokoto": "It hurts when your own acceptance is missing",
      "body": "Human beings naturally want recognition. It is a kind of nourishment, and wanting it is not wrong. But being unable to feel okay without it may suggest some dependence.\n\nHarshness towards yourself can be a major reason you lose sight of who you are. People often treat themselves mercilessly in ways they would never treat others.\n\nWithout your own acceptance, approval is hard to receive however hard you work outside. Today, look at your words and actions as though they belonged to someone else. If empathy appears, that is recognition.",
      "toi": "Whose recognition did you want most? Perhaps that person’s voice now lives within you.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-08-20",
          "title": "When a lack of recognition becomes painful",
          "id": "20240820_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-07-01",
          "title": "Recognising yourself opens the way to recognition from others",
          "id": "20240701_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-06-02",
          "title": "People keep trying because someone sees them",
          "id": "20250602_01"
        }
      ]
    },
    "q009": {
      "hitokoto": "Jealousy may tell you that you are pushing yourself too hard",
      "body": "You may judge yourself as ugly for feeling this way. Yet jealousy often appears when you have been forcing yourself. In a sense, it is as natural as a stomach growling when hungry.\n\nIf you are struggling desperately beside someone loved simply as they are, your heart responds. Judging yourself only lowers your energy and makes you more reactive. Beneath it may be the belief that you are not good enough.\n\nAnd when you recognise something wonderful in someone else, it may be because a similar quality exists in you too.",
      "toi": "What you envied may be a way you wanted to live yourself. Where have you been pushing too hard?",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-08-29",
          "title": "Jealousy can signal a depleted heart",
          "id": "20250829_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-11-22",
          "title": "Jealousy tells you about a sense of lack; you need not hate it",
          "id": "20241122_02"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-05-31",
          "title": "Find in yourself the wonderful qualities you see in others",
          "id": "20260531_01"
        }
      ]
    },
    "q010": {
      "hitokoto": "Do not disguise self-criticism as reflection",
      "body": "I should have done that differently: the thought can circle endlessly before sleep. It may look diligent and sincere, but criticism disguised as reflection wounds your energy and enlarges regret and guilt.\n\nThen you freeze when it is time to act again, and criticise yourself once more. Reflection is meant to help next time. Once you have noticed what you will do differently, it can end.\n\nBefore bed today, offer yourself appreciation: you did well today too. If you are going to use energy, let it support tomorrow.",
      "toi": "What would happen if you said these words to someone you love every night? These are the words you are saying to yourself.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-07-22",
          "title": "Do not disguise criticism as reflection",
          "id": "20240722_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-02-01",
          "title": "To live better, release the habit of self-reproach",
          "id": "20260201_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-06-18",
          "title": "What happens when you stop reviewing your faults before bed",
          "id": "20260618_01"
        }
      ]
    },
    "q011": {
      "hitokoto": "True confidence is the quiet strength of staying with yourself",
      "body": "If only I had confidence, I could do it: we sometimes feel this. Yet when confidence is truly present, we are no longer debating whether we have it.\n\nConfidence built on ability or praise can fall away when those conditions disappear. True confidence is a foundation within, the quiet power of being with yourself in a place beyond other people’s judgements.\n\nStop evaluating whether you have enough, and cherish who you are today. Confidence grows with the time you spend living alongside yourself.",
      "toi": "What have you placed beyond the words once I am confident? Is it truly out of reach for today’s you?",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-10-17",
          "title": "How to grow true confidence",
          "id": "20251017_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-10-30",
          "title": "Confidence you build up, and confidence that needs no embellishment",
          "id": "20241030_01"
        }
      ]
    },
    "q012": {
      "hitokoto": "Your own nature lives in ordinary things",
      "body": "Being yourself may be much closer than a special talent or a clear vision.\n\nThe topic that makes you animated in conversation. Something you do without being asked. Something you keep doing for no particular reason. Little pieces of you are scattered through these ordinary moments.\n\nYou need not describe them perfectly. When you notice this somehow feels like me, gently pick up that small feeling instead of letting it pass.",
      "toi": "What moved your heart today without a reason? You are already present within that little feeling.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-06-14",
          "title": "What does being yourself mean? A simple way to find it",
          "id": "20260614_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-06-24",
          "title": "Use your senses when you lose sight of yourself",
          "id": "20250624_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-09-25",
          "title": "Shine by becoming yourself, rather than somebody",
          "id": "20240925_01"
        }
      ]
    },
    "q013": {
      "hitokoto": "Your ability to feel may simply be tired",
      "body": "Not knowing what you want can make you anxious. But it does not necessarily mean there is nothing you want. Your ability to feel may be worn out.\n\nPeople who have worked hard for a long time often put should before like. What you want is often something you naturally find yourself doing, rather than something to hunt down. Searching harder can draw you deeper into feeling unable to find it.\n\nToday, choose one thing by whether it feels gently pleasant, rather than demanding to know whether you love it. With that ease in everyday life, your wishes may quietly appear.",
      "toi": "Which option feels a little better now? Your body may know before your mind does.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-06-02",
          "title": "When you do not know what you want to do",
          "id": "20260602_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-11-25",
          "title": "Searching harder can hinder finding what you want",
          "id": "20241125_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-11-19",
          "title": "What to do when you cannot find your desire",
          "id": "20251119_01"
        }
      ]
    },
    "q014": {
      "hitokoto": "Loving yourself means no longer cornering yourself",
      "body": "Many people do not know what loving themselves means. It is neither indulgence nor giving selfishness free rein.\n\nIt is not a condition fulfilled by doing a particular thing, but a state of accepting yourself unconditionally. Perhaps the simplest description is: you are no longer driving yourself into a corner.\n\nInstead of searching for a method, listen to how you usually approach yourself. If you are judging, blaming, or feeling ashamed, soften that harshness a little. Unconditional acceptance even includes the part of you insisting that you must love yourself.",
      "toi": "Could you say those same words to a small child every day? The difference shows how much harder you are being on yourself.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-08-26",
          "title": "Understanding what self-love really means",
          "id": "20240826_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-06-17",
          "title": "A concrete way to love yourself",
          "id": "20240617_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-11-25",
          "title": "When self-love becomes an obligation",
          "id": "20251125_01"
        }
      ]
    },
    "q015": {
      "hitokoto": "Simply turn your radar towards yourself",
      "body": "We begin life centred in ourselves. As we learn that living with others requires adapting, we gradually become centred on other people. Sensitive people can read others’ energy so readily that it becomes their normal way of being.\n\nPlease do not blame yourself for having lived this way. Blame only sends your centre farther outside.\n\nThere is one thing to practise: turn the radar you have aimed at others towards yourself. Just once today, ask how you feel right now. One millimetre a day becomes a centimetre in ten days. Your inner centre grows little by little.",
      "toi": "You read other people’s faces so well. What about your own? What expression are you wearing now?",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-09-09",
          "title": "Accepting your outward-centred past helps you return to yourself",
          "id": "20250909_02"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-04-12",
          "title": "For those who have read others’ moods since childhood",
          "id": "20260412_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-05-23",
          "title": "An inner centre grows through small daily accumulations of energy",
          "id": "20260523_01"
        }
      ]
    },
    "q016": {
      "hitokoto": "Sometimes the hardest part is being unable to say that it hurts",
      "body": "There may be times in life when simply being alive feels difficult. The hardest part can be feeling unable to tell anyone. Being able to say I am struggling is a very good thing.\n\nDiligence and responsibility often lie beneath this difficulty. When you continually give yourself orders about what you must do, your unadorned self loses energy.\n\nAllowing even one thing you would not usually permit yourself can soften that tension. If your body is struggling, seeing a professional is also a way of caring for yourself.",
      "toi": "If you told one person I am struggling right now, who would it be? Picture their face.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-08-31",
          "title": "Something to try when life feels difficult",
          "id": "20240831_01"
        },

          "media": "Ameblo blog · Japanese source",
          "date": "2024-09-08",
          "title": "Difficulty living can express the inner child’s pain",
          "id": "20240908_01"
        },
        {

          "date": "2025-02-08",
          "title": "Being highly sensitive is not itself why life feels difficult",
          "id": "20250208_01"
