    "q017": {
      "hitokoto": "Difficulty switching on can be a sign",
      "body": "After a break, you may blame yourself for being unable to get into work. But this does not mean you are lazy or inadequate.\n\nWork you enjoy is easy to switch on for. With work you do not enjoy, it can take longer each year. Perhaps you have had your fill of this particular work. If you can keep going on habit alone, that may reveal how much energy you are really putting into it.\n\nInstead of forcing enthusiasm, notice where you have been moving only through duty or obligation. Today, do a little something that is for you.",
      "toi": "How much energy do you actually want to give this work? Gently look at the honest feeling beneath the habit.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-01-05",
          "title": "When it is difficult to switch into work mode",
          "id": "20260105_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-10-16",
          "title": "What to know when motivation will not come",
          "id": "20251016_02"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-04-06",
          "title": "For those blaming themselves for a lack of motivation",
          "id": "20260406_01"
        }
      ]
    },
    "q018": {
      "hitokoto": "Love comes first; work follows",
      "body": "Many people wish they could make a living doing what they love. Yet a hobby does not instantly become a job. Often it happens when making it a job was not the original intention: work was the result, not the purpose.\n\nSeen through energy, love for something carries a powerful vibration that moves people. Today, set the work part aside and simply spend time with what you love. That passion is what can keep you going for months and years.",
      "toi": "What was so enjoyable that you forgot the time, meals, or sleep? Find your love for it first.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-12-13",
          "title": "For those who want to make a living doing what they love",
          "id": "20251213_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-04-27",
          "title": "Things made with love can sell",
          "id": "20240427_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-09-02",
          "title": "Following your love until skill grows",
          "id": "20250902_01"
        }
      ]
    },
    "q019": {
      "hitokoto": "Your career does not need to be fixed in advance",
      "body": "Many people feel anxious because they cannot picture their career ahead. With AI changing the world, even next year may look very different. Difficulty drawing a clear vision is not your fault.\n\nTry looking at the essence of a career rather than a job title: whatever work you do, how would you like to live? Work backwards from that feeling.\n\nHints may already exist in what you do now. Instead of setting the future rigidly, look at it with enjoyment and flexibility.",
      "toi": "Whatever my work, this is the kind of life I want. Write that one line in your own words.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-11-04",
          "title": "Why you need not define your career clearly right now",
          "id": "20251104_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-01-28",
          "title": "Hints for your ideal working life are in your current work",
          "id": "20260128_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-07-17",
          "title": "A career setback can signal a new direction",
          "id": "20250717_01"
        }
      ]
    },
    "q020": {
      "hitokoto": "That exhaustion may signal attention turned outward",
      "body": "People who work hardest often do not realise they are overdoing it. They may believe they still are not doing enough.\n\nPerhaps you have run straight towards praise and recognition, believing that was the right way to live. Yet however hard you work, recognition may not reach you because you have not accepted yourself.\n\nThat exhaustion is a familiar feeling when awareness is directed outward. Today, offer yourself one simple acknowledgement: you are doing well.",
      "toi": "Whose words did you hope all that effort would bring, and what were they? Offer those words to yourself.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-06-14",
          "title": "First understand why you push yourself too hard",
          "id": "20250614_02"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-07-28",
          "title": "Recognising the signs of overexertion",
          "id": "20250728_02"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-02-01",
          "title": "What people who carry too much most need to prioritise",
          "id": "20240201_01"
        }
      ]
    },
    "q021": {
      "hitokoto": "Easing your effort is not irresponsible",
      "body": "I must do it; if I ease up, I will trouble someone. Such thoughts can make it hard to let go even beyond your limits.\n\nResponsibility originally comes from love: giving energy to what you believe in. Mixed with fear and obligation, it can become a force that crushes you.\n\nDoes they need me come from love, or from trying to feel your existence matters by being useful? People with strong responsibility may see relaxing as irresponsible, but adjusting your energy is necessary to avoid breaking yourself. Protecting it lets you meet responsibility when it truly matters.",
      "toi": "Does this responsibility arise from love, or from a wish to be needed?",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-06-06",
          "title": "Living without letting responsibility crush you",
          "id": "20260606_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-05-01",
          "title": "Illness arising from a heavy sense of responsibility",
          "id": "20250501_02"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-02-01",
          "title": "What people who carry too much most need to prioritise",
          "id": "20240201_01"
        }
      ]
    },
    "q022": {
      "hitokoto": "Trying too forcefully can push results farther away",
      "body": "It is easy to become anxious when effort brings no visible result. Yet trying harder to produce one can create too much tension. Beneath it may be a large store of self-rejection: I am no good unless I achieve something. Starting from fear makes results harder to reach.\n\nThe physical world is a world of process. Planting a seed today does not bring growth instantly. Results can seem more distant the tighter you grip them.\n\nTo produce something, first let your own heart become warm. Find one small point of interest in what you are doing now.",
      "toi": "If you set the result aside for a moment, what remains interesting about the work itself? Savour that.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-03-16",
          "title": "If you want results, stop trying to force results",
          "id": "20260316_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-03-30",
          "title": "A new beginning need not produce results immediately",
          "id": "20260330_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-06-01",
          "title": "Results follow when you release attachment",
          "id": "20260601_01"
        }
      ]
    },
    "q023": {
      "hitokoto": "There is something to look at before deciding how to leave",
      "body": "When you keep pushing yourself, you may be living with other people as your first priority. More than deliberately forcing yourself, you prioritise being loved or avoiding dislike, leaving yourself last.\n\nBefore searching for a way to quit, ask why you put others first. Often you will find the wish to be loved and the fear of being disliked.\n\nHave you asked others to take on the role of loving you instead of offering yourself love? Seeing this can help you decide not to keep forcing yourself beyond your limits.",
      "toi": "Have you handed someone else the role of loving you for you? Look quietly, without rushing.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-11-13",
          "title": "When you want to stop overdoing it but cannot",
          "id": "20241113_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-03-13",
          "title": "There is meaning in people leaving",
          "id": "20250313_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-03-10",
          "title": "For those unable to move on after a painful resignation",
          "id": "20260310_02"
        }
      ]
    },
    "q024": {
      "hitokoto": "Security can lie in circulation, not just an amount",
      "body": "Many people worry about the future so much that spending money feels difficult. Yet having money does not automatically bring peace. The amount that feels safe differs from person to person, and spending reduces it.\n\nIn this perspective, reassurance comes not simply from having a large amount, but from circulation: money can come in after it goes out.\n\nDo not limit your image of receiving to a salary alone. Remaining open to abundance from many directions allows the energy of money to move more freely.",
      "toi": "How much have I decided I need in order to feel safe? Look at what that number represents.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-11-29",
          "title": "Awareness Room 56: attachment to money and financial stability",
          "id": "20241129_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-04-29",
          "title": "True reassurance about money lies in circulation",
          "id": "20250429_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-04-19",
          "title": "What happens when you welcome abundance",
          "id": "20240419_02"
        }
      ]
    },
    "q025": {
      "hitokoto": "A sense of lack may hide beneath I must save",
      "body": "Perhaps you know the feeling: the harder you try to save, the more money seems to leave. Beneath I must save may be the energy of not enough and fear about the future.\n\nIn this view of energy, what you focus on draws more of the same. Attention fixed on lack brings a reality of lack.\n\nEconomising need not mean enduring deprivation. It can mean no longer spending on things that do not move your heart. More than trying to accumulate, notice whether you can feel money circulating. Today, find one small gratitude for something you were able to pay for.",
      "toi": "What is one thing you spend on that does not reflect your honest wishes or move your heart?",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-06-17",
          "title": "Why trying harder to save can leave you unable to save",
          "id": "20260617_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-06-17",
          "title": "Economising means no longer spending on what does not move your heart",
          "id": "20250617_02"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-12-06",
          "title": "Saving and awareness: money as energy",
          "id": "20241206_02"
        }
      ]
    },
    "q026": {
      "hitokoto": "Overspending may be your heart calling out",
      "body": "Spending freely and feeling guilty afterwards can happen when your energy is low. Something feels missing within, and you try to fill it by acquiring things.\n\nBlaming or punishing yourself lowers your energy further, and you may spend again. Begin by not blaming yourself. Then gently ask what part of you feels a lack.\n\nSome feeling is calling out beneath the spending. Once you can see it, things may naturally settle.",
      "toi": "Was the thing you bought what you truly wanted then, or was it something entirely different?",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-11-12",
          "title": "Understanding the real reason for overspending",
          "id": "20241112_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-02-10",
          "title": "The heart’s message hidden in spending",
          "id": "20240210_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-02-23",
          "title": "Money for genuine interests is an expense, not necessarily waste",
          "id": "20250223_01"
        }
      ]
    },
    "q027": {
      "hitokoto": "Spending on joy is not wrong",
      "body": "Sometimes we shame or punish ourselves for becoming absorbed in what we love. Yet we can spend money precisely because we are alive. We want tools that let us experience our interests.\n\nA watercolour painting need not use only red and blue. Many colours allow many forms of expression. We too are here to experience the varied colours of joy.\n\nIf your heart is happy, you are nourishing yourself. Please do not turn what brings enjoyment into something bad.",
      "toi": "Was your heart happy when you spent that money? Remember the feeling itself.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-04-08",
          "title": "Guilt that appears when spending on joy",
          "id": "20260408_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-04-29",
          "title": "Spend on what has value: joy",
          "id": "20240429_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-08-27",
          "title": "A happy way to use money, beyond a clever one",
          "id": "20250827_01"
        }
      ]
    },
    "q028": {
      "hitokoto": "Sadness may be what lies beneath the block",
      "body": "You may want money while feeling it is dirty or that you are not worth that much, then feel ashamed of those thoughts.\n\nBut a money block may not truly be about money. It can be the sadness left by having the belief you must not wish for happiness planted within you. That is why affirming that you may be abundant can feel like being pulled back by a rubber band.\n\nBefore trying to remove it, notice it. From there, you can begin offering yourself a new message.",
      "toi": "Whose voice taught you that you must not wish for happiness? Look gently at where it came from.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-06-11",
          "title": "Why trying to remove money blocks may not remove them",
          "id": "20260611_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-03-27",
          "title": "Learn how money circulates, beyond studying money",
          "id": "20250327_01"
        }
      ]
    },
    "q029": {
      "hitokoto": "Fear about old age may carry a message from the present",
      "body": "People of many ages fear what life will be like when they are older. Interestingly, they may skip over the next two or three years and focus directly on old age. Creative energy goes into imagining an unhappy situation that has not happened.\n\nThis is a trick of thought. Beneath it may be a feeling that life now is not enjoyable. Concern about reserves can also reflect feeling short of energy in the present.\n\nToday, bring attention back to now. A future can grow from the way you enjoy living today.",
      "toi": "How would you truly like to spend this day currently devoted to worrying about a future that has not arrived? Just today’s portion.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-10-26",
          "title": "For younger people who worry about their imagined old age",
          "id": "20241026_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-01-12",
          "title": "Stability in later life begins with living fully now",
          "id": "20250112_01"
        }
      ]
    },
    "q030": {
      "hitokoto": "You have a part in creating your own happiness",
      "body": "You cannot meet someone, move forward, or keep a relationship going. Each time, you may wonder whether something is wrong with you.\n\nPain in love can arise from expecting someone else to fulfil you. Handing your life to the person you love becomes painful. Focusing strongly on requirements can also hide fear of rejection, before you are ready to love another person.\n\nWhat matters may be less a checklist made by the mind than the atmosphere—the vibration—that feels right when you are together. Today, meet one of your own needs yourself.",
      "toi": "If you offered care to the place you want someone else to fill, what could you do?",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-12-15",
          "title": "What to know when love feels painful",
          "id": "20241215_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-08-28",
          "title": "Partner ideals: the mind and soul seek different things",
          "id": "20250828_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-11-22",
          "title": "Awareness Room 55: difficulties in love and marriage",
          "id": "20241122_01"
        }
      ]
    },
    "q031": {
      "hitokoto": "Walking together begins on your own feet",
      "body": "Every relationship can have periods when feelings fail to meet. Partnership is like walking a three-legged race. Leaning entirely on the other person prevents movement, but moving only for yourself will not create a shared rhythm either.\n\nBalancing your own happiness with attention to your partner supports the relationship. However different you are, respecting what each person cannot compromise on can help you live well together.\n\nCaring for yourself makes a good connection possible. A better relationship with your partner grows from your relationship with yourself.",
      "toi": "Have I ever honestly told my partner what I truly cannot compromise on?",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-11-22",
          "title": "Building a better partnership",
          "id": "20251122_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-04-30",
          "title": "Respecting each other’s non-negotiable needs",
          "id": "20250430_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-08-28",
          "title": "Partner ideals: the mind and soul seek different things",
          "id": "20250828_01"
        }
      ]
    },
    "q032": {
      "hitokoto": "Anger can be an expression of sadness",
      "body": "Many people feel persistent anger towards a spouse. Believing anger is bad, they swallow it. Yet even if consciously suppressed, it can continue swirling like magma under a sealed volcano.\n\nThe more you dismiss it as something from long ago, the more it may return unexpectedly. Anger can express sadness. Wanting to blame the other person may mean wanting them to understand your pain.\n\nWrite in a notebook, speak aloud alone, or sing it out. As the feeling finds expression, you can meet the honest wishes beneath it.",
      "toi": "What words did you want someone to hear about the sadness beneath this anger? Write them down.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-05-10",
          "title": "Awareness Room 34: I cannot stop being angry with my husband",
          "id": "20240510_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-01-27",
          "title": "When old anger returns repeatedly",
          "id": "20260127_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-12-15",
          "title": "Using the energy of anger constructively",
          "id": "20251215_01"
        }
      ]
    },
    "q033": {
      "hitokoto": "Look at the heart beneath the attachment",
      "body": "You may wish you could stop thinking about someone. But attachment often comes from anxiety: I cannot manage without this. Until that anxiety eases, simply trying to stop clinging may not work.\n\nA tightly closed hand cannot receive something new. Letting go can mean opening your hand to receive, rather than giving up.\n\nInstead of trying to fix attachment itself, care for the weakened heart beneath it. Gently ask what fear is making you hold on. When light reaches that place, the attachment may naturally soften.",
      "toi": "What are you afraid of losing if this person is not there? Ask your heart.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-01-03",
          "title": "Looking at the anxiety beneath attachment helps it soften",
          "id": "20260103_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-04-15",
          "title": "Why trying harder to release attachment can make it harder",
          "id": "20240415_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-04-30",
          "title": "For those afraid to release painful attachment",
          "id": "20260430_01"
        }
      ]
    },
    "q034": {
      "hitokoto": "Sometimes being together can feel lonelier",
      "body": "Fear of being alone often lives beneath the inability to decide. Some people remain in an unhappy relationship to avoid loneliness. Yet being with someone whose heart does not meet yours can be lonelier still.\n\nBeing alone can reset your energy. Feelings may linger for a while, but as things settle, your own strength can return.\n\nA parting is also a passage, not simply an ending. Beyond whether the relationship lasted, you have received something important from it. The experience can bring a new version of you into being.",
      "toi": "Within this relationship, do our hearts truly reach each other? You need not rush the answer.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-03-16",
          "title": "What happens when you choose parting without fearing solitude",
          "id": "20240316_02"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-11-28",
          "title": "Both meetings and partings have meaning",
          "id": "20241128_02"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-08-08",
          "title": "A one-way connection may signal a time to step away",
          "id": "20240808_01"
        }
      ]
    },
    "q035": {
      "hitokoto": "It is okay if parent and child cannot be close",
      "body": "Many people carry this heaviness. Even with a family bond and shared blood, you are separate in energy. The more you insist because we are family or even though we are family, the more an ideal can weigh down the relationship.\n\nIt is okay if parent and child cannot get along. Instead of seeing it as wrong or shameful, try seeing each other as individual people.\n\nIf your mother’s words still echo, you might ask whether the person who spoke them was happy herself. Being able to say that it hurts means you have already begun to move.",
      "toi": "How do you truly want things to be with your mother? An answer may already be resting quietly within you.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-02-13",
          "title": "It is okay if parent and child cannot be close",
          "id": "20260213_02"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-02-15",
          "title": "Learning from the painful spell of a parent’s words",
          "id": "20260215_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-02-28",
          "title": "Awareness Room 63: my suffering is my mother",
          "id": "20250228_01"
        }
      ]
    },
    "q036": {
      "hitokoto": "Do not hurt yourself to keep your parents from sadness",
      "body": "Perhaps you have played the ideal child for your parents since childhood. Even as an adult, you still feel you must manage their reactions.\n\nBeneath this is care for them: I must not make my parents sad. But while protecting them from sadness, you may be making yourself sad. Even a close family can leave you conflicted if your true self and outward self are far apart.\n\nToday, gently separate their feelings from yours. Being so concerned about someone else that you neglect yourself is not the whole of kindness.",
      "toi": "How much of life have you spent as the person your parents wanted, and how much as your unguarded self? Quietly notice.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-03-09",
          "title": "For adults still playing the child their parents need",
          "id": "20260309_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-02-03",
          "title": "Even a close family can leave inner conflict",
          "id": "20250203_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-01-04",
          "title": "Parents may not know their child’s feelings",
          "id": "20250104_01"
        }
      ]
    },
    "q037": {
      "hitokoto": "Some worry may come from fear rather than love",
      "body": "Worrying about your child is a natural feeling for a parent. That part is welcome. But excessive worry can be driven by feelings from your own childhood.\n\nThe more you endured or felt lonely, the more urgently you may wish to spare your child the same. What looks like worry as love may include fear that they will suffer as you did. While you seem to be watching your child, your younger self may still be crying.\n\nSometimes the feeling comes from the little child within you, rather than a problem with your child. Love also means watching over them with trust. Today, do one thing that brings you joy.",
      "toi": "Am I worrying about my child now, or about the child I once was? Look gently for a moment.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-04-22",
          "title": "What excessive worry about your child may mean",
          "id": "20250422_02"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-05-30",
          "title": "True love includes watching over with trust",
          "id": "20250530_02"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-01-12",
          "title": "A happy way to support your child’s future",
          "id": "20240112_02"
        }
      ]
    },
    "q038": {
      "hitokoto": "Your child may be trying to respect their own feelings",
      "body": "Not knowing what to do can feel bewildering. In an energetic reading, parents of children who stop attending school have often been very diligent since childhood, carefully playing their role without troubling their own parents.\n\nTheir children may not be trying to cause trouble, but to respect and prioritise their own feelings. The belief that being different is shameful may echo the concern for appearances you grew up with.\n\nToday, also notice the part of you asking for help within your own heart.",
      "toi": "Is the pain around my child about other people’s judgements, or about what I had to endure long ago?",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-11-15",
          "title": "What parents of children not attending school may need to notice",
          "id": "20241115_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-03-01",
          "title": "The meaning of a child who challenges a parent’s beliefs",
          "id": "20260301_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-03-22",
          "title": "Awareness Room 28: school absence and withdrawal in the family",
          "id": "20240322_01"
        }
      ]
    },
    "q039": {
      "hitokoto": "You are also a family member who deserves your care",
      "body": "Why do they not understand when we are family? The because and even though in those thoughts can be what hurts.\n\nEven close relatives have different energies. However near they are, they are not the same as you. First understand your irritation: I wanted them to understand, and they did not.\n\nYou need not endure or forgive simply because someone is family. The family member you most need to cherish is yourself. If it is too painful, you are allowed some distance.",
      "toi": "How did you truly want your family to treat you? Begin by offering some of that care to yourself.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-12-26",
          "title": "Why because we are family and even though we are family can hurt",
          "id": "20251226_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-08-17",
          "title": "What to consider when going home feels uncomfortable",
          "id": "20240817_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-02-03",
          "title": "Even a close family can leave inner conflict",
          "id": "20250203_01"
        }
      ]
    },
    "q040": {
      "hitokoto": "Letting go of they should notice can lighten the load",
      "body": "It is always me, you think, while continuing to work today. The more you feel I should not have to say it; they should notice, the more endlessly you may carry. Then your heart or body reaches its limit, and you dislike yourself for it. You deserve kinder treatment.\n\nHousehold work needs doing, but if you live with family, it is not yours alone. Rather than continuing to endure, learn ways of helping yourself.\n\nToday, name and write down one small invisible task. Talking about it clearly can be part of finding relief.",
      "toi": "Beneath I wish they would notice, what did you really want to say?",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-03-26",
          "title": "Do not keep enduring unequal household work",
          "id": "20250326_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-10-29",
          "title": "Making invisible labour visible can reduce exhaustion",
          "id": "20251029_02"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-04-02",
          "title": "Something to try when it is always me",
          "id": "20260402_01"
        }
      ]
    },
    "q041": {
      "hitokoto": "Sadness often waits beneath irritation",
      "body": "Sometimes irritation will not settle, however hard you try. It can be anger being held back, and sadness often lies beneath that anger.\n\nRather than deciding that your irritated self is bad or unlovable, try understanding: I was feeling this sadness, and that is why I became irritated. That recognition can bring relief and let the irritation gradually soften.\n\nToday, write the feeling into a notebook. A swallowed emotion may vanish from your thoughts for a moment while continuing to live within your feelings.",
      "toi": "What was truly sad beneath this irritation? What did you leave without words?",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-03-21",
          "title": "Notice the important feeling beneath irritation",
          "id": "20240321_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-12-15",
          "title": "Using the energy of anger constructively",
          "id": "20251215_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-01-27",
          "title": "When old anger returns repeatedly",
          "id": "20260127_01"
        }
      ]
    },
    "q042": {
      "hitokoto": "That unsettled feeling is a signal from your heart",
      "body": "You may blame yourself for being unable to put it into words. But a concern exists even before language arrives.\n\nUnease can be the heart saying that the energy does not fit. The mind often rejects it: leaving now would be a loss; ending this connection would waste something. Ignoring it through calculations of gain and loss may make the discomfort grow rather than disappear.\n\nToday, make some time without analysis. Simply write your feelings on paper. Like fog clearing, something may gradually become visible.",
      "toi": "What is this unease saying no to? Let the question rest without rushing an answer.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-12-07",
          "title": "Do not ignore a feeling that something does not fit",
          "id": "20251207_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-05-20",
          "title": "When you do not know what is troubling you",
          "id": "20260520_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-07-17",
          "title": "Unease can signal accumulated feelings needing release",
          "id": "20240717_01"
        }
      ]
    },
    "q043": {
      "hitokoto": "Stay beside yourself: there are days like this too",
      "body": "Of course you want to feel better soon. But human beings are not constant: we have good days and difficult ones. Forcing your mood upward can make it harder.\n\nIn this reflection, self-blame is one source of low energy. A blaming awareness can act like a knife against your own energy, leaving the heart depleted.\n\nWithout doing anything special, quietly stay beside yourself: yes, there are days when I feel low and tired. Kindness gives your mood room to rise. Not attacking yourself conserves the heart’s energy.",
      "toi": "Just before your mood fell, what did you say to yourself? Quietly recall that one sentence.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-08-04",
          "title": "What to do when you feel low or have little energy",
          "id": "20250804_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-11-20",
          "title": "There is a reason when the heart sinks",
          "id": "20241120_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-03-17",
          "title": "A short path towards feeling better when energy is low",
          "id": "20240317_01"
        }
      ]
    },
    "q044": {
      "hitokoto": "You do not have to force forgiveness",
      "body": "They did not understand; they did not receive what I felt. Each reason may carry sadness. Hurt can become anger, and beyond anger, an inability to forgive.\n\nIf you cannot forgive, you need not force it. Do not punish that feeling. Understand instead how deeply sad the experience was.\n\nAllow yourself to be someone who cannot forgive yet. Even while anger remains, acceptance can gradually bring a feeling that it no longer matters so much. Today, focus on caring for yourself in the present.",
      "toi": "What hurt most in the event you cannot forgive? Touch that place gently, and only that place.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-10-05",
          "title": "Allowing yourself not to forgive opens the way to acceptance",
          "id": "20241005_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-09-05",
          "title": "When you cannot forgive, you do not have to",
          "id": "20240905_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-01-09",
          "title": "Changing your relationship with what feels unforgivable",
          "id": "20240109_01"
        }
      ]
    },
    "q045": {
      "hitokoto": "Rejecting negativity can become the deeper burden",
      "body": "The harder you try to remove negative thinking because it is bad, the more you may dislike yourself when it stays. Then another layer of negativity appears.\n\nThe deeper negative force can be the awareness that hates negativity. If feelings were crayons, a picture could not be made from bright colours alone. Dark colours have their place too. Negativity can even hold a wealth of creativity.\n\nToday, do not try to drive that part of you away. Let it be: there are times like this. When it is accepted, the suffering can quietly ease.",
      "toi": "Through all those years of disliking your negative self, what was that rejecting awareness trying to protect?",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-02-23",
          "title": "To release negative thinking, stop hating it",
          "id": "20260223_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-02-26",
          "title": "Many reasons not to hate negativity",
          "id": "20250226_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-11-17",
          "title": "The awareness that attracts negative experiences",
          "id": "20241117_01"
        }
      ]
    },
    "q046": {
      "hitokoto": "When you worry, allow a little softness",
      "body": "Anxiety can leave you unable to move forward and your body tense. The more worried you are, the more you may try to think your way out. But thinking does not necessarily reduce worry, and constant thought can make your energy heavier.\n\nThat is why a little loosening matters when concerns arise. Prioritise something that brings relief, include something that makes you smile, and relax your body. Energy can begin to change through that softness.\n\nWhen outside information shakes you, returning to your own centre also helps you trust your own senses.",
      "toi": "How many things are actually troubling me in this exact moment? Count them one by one.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-06-20",
          "title": "Loosen your grip when problems and worries arise",
          "id": "20240620_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-08-08",
          "title": "For those made anxious by frightening information",
          "id": "20250808_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-11-01",
          "title": "Awareness Room 59: anxiety and fear",
          "id": "20241101_01"
        }
      ]
    },
    "q047": {
      "hitokoto": "There is a reason your decision is not coming",
      "body": "A deadline or the wish not to disappoint someone can make you force yourself. Yet inability to decide may mean that now is not the moment, or that the choice is not right for you. Either way, something keeps your heart from saying yes.\n\nAn answer forced out can lead to regret. When you are unsure, the answer may be hidden rather than absent.\n\nSet the dilemma aside for a moment, return to the here and now, and breathe fully. As the fog clears, you may find the answer was there from the beginning.",
      "toi": "Where in this choice is your heart quietly saying no? Listen without rushing.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-11-07",
          "title": "There is always a reason when you cannot decide",
          "id": "20241107_02"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-05-04",
          "title": "What to do when you feel unsure",
          "id": "20240504_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-04-21",
          "title": "How can you know whether the path you chose is right?",
          "id": "20260421_01"
        }
      ]
    },
    "q048": {
      "hitokoto": "Being yourself can be your right answer",
      "body": "Not wanting to make a mistake is understandable. But the right answer you seek may belong to society or other people’s expectations, rather than to you.\n\nThe longer you adapt to others, the more you may crave an answer and be swayed by information claiming to provide it. Often there is no universal right answer there.\n\nInstead, ask what experience would be enjoyable to offer yourself today, and act for yourself. Being your unadorned self can be your answer.",
      "toi": "Whose right answer was I seeking: society’s, or my own?",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-04-20",
          "title": "Seeking only correct answers can obscure your answer",
          "id": "20260420_02"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-10-10",
          "title": "Seeking certainty too intensely can stop your life",
          "id": "20251010_02"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-11-18",
          "title": "Your heart knows the way of learning that fits you",
          "id": "20241118_01"
        }
      ]
    },
    "q049": {
      "hitokoto": "Change can begin when you return to the present",
      "body": "The more urgently you want to change, the harder it may feel. Sometimes that wish includes not wanting to see your current situation, almost abandoning the here and now.\n\nSet it aside and savour the ordinary life before you. Eat something you want, see someone you miss, or read the book you have been meaning to open. Such simple experiences bring your centre back and set energy moving.\n\nWhat you truly seek may be returning to your original self, rather than becoming someone else. As you care for who you are now, things can naturally change.",
      "toi": "When I say I want to change, what part of now do I least want to see? Gently turn towards it.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-04-14",
          "title": "What to do when wanting to change makes change difficult",
          "id": "20250414_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-07-08",
          "title": "Why you cannot change despite wanting to",
          "id": "20240708_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-06-15",
          "title": "What to know when you want to change",
          "id": "20250615_01"
        }
      ]
    },
    "q050": {
      "hitokoto": "Perfectionism can be an extreme form of idealism",
      "body": "Perfectionism can mean carrying many rules in your mind: it should be this way; anything else is wrong. Reality does not obey them, so you may remain angry at things, people, and especially yourself.\n\nBeneath this may be fear of failing or being ridiculed. Energy grows while it flows. Aiming only at perfection can stop it like stagnant river water.\n\nToday, begin one thing that the person you are now can do. Human beings make errors; we are not creatures who become perfect.",
      "toi": "When, and from whom, did you receive one of these inner rules? Recall just one.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-02-28",
          "title": "Perfectionism as extreme idealism",
          "id": "20240228_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-04-28",
          "title": "It must be perfect stops energy flowing",
          "id": "20260428_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-11-06",
          "title": "Accepting imperfection expands what you can do as a person",
          "id": "20241106_01"
        }
      ]
    },
    "q051": {
      "hitokoto": "Calling an experience a failure can be the real loss",
      "body": "You may want to begin something new yet be unable to take the first step. In this reflection, it is not the experience alone that wounds you, but a preexisting habit of blaming yourself when things go wrong. What frightens you may be that self-blame more than failure itself.\n\nTurning a setback into a personal defect wastes a valuable chance to gain experience. If you let everything be experience without colouring it success or failure, all of it becomes a foundation.\n\nToday, take one small action to enjoy an experience, rather than to produce a result.",
      "toi": "Was what I have called failure truly a failure, or was it an experience?",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-09-26",
          "title": "Making failure into failure is the real failure",
          "id": "20240926_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-01-03",
          "title": "For those afraid they cannot recover from a setback",
          "id": "20250103_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-02-16",
          "title": "Success becomes possible when failure is allowed to be experience",
          "id": "20260216_01"
        }
      ]
    },
    "q052": {
      "hitokoto": "You are a living being, not a machine",
      "body": "There can be days when tiredness lingers despite rest. In this energetic perspective, humans are organic beings, and being surrounded by the inorganic can create a sense of electromagnetic confinement and fatigue. If your rest was spent entirely inside a screen, your energy may have kept working.\n\nToday, spend a little time with something living. Stop at a nearby park or water a balcony plant. Letting hands or feet touch soil can help you feel life’s energy move.\n\nThere is no need for guilt about cherishing and replenishing yourself.",
      "toi": "Is this tiredness about how I rest, or about not allowing myself to rest?",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-09-06",
          "title": "Living without digital exhaustion: remember you are alive",
          "id": "20250906_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-07-09",
          "title": "Cherish and replenish the self who works hard every day",
          "id": "20240709_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-06-15",
          "title": "When your body will not move as you wish",
          "id": "20260615_01"
        }
      ]
    },
    "q053": {
      "hitokoto": "The heart’s daytime state can shape the night",
      "body": "Being tired yet unable to sleep night after night is difficult. The state of your heart can matter alongside the bedroom and bedding. Worry, anger, and sadness can stimulate thought and keep awareness from resting.\n\nFeeling on edge is, in this perspective, energy continuing to turn without softening. Rather than forcing sleep, allowing your heart more ease during the day may help.\n\nTonight, go to bed remembering one enjoyable moment or something you appreciate from today. The time before sleep can also shape the energy you carry into tomorrow.",
      "toi": "On a sleepless night, what words repeat in your mind, and to whom are they addressed? Quietly notice.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-02-21",
          "title": "Good sleep begins with the heart’s state during the day",
          "id": "20260221_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-01-24",
          "title": "The relationship between sleeplessness and energy",
          "id": "20240124_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-08-15",
          "title": "The time before sleep shapes tomorrow’s vibration",
          "id": "20250815_01"
        }
      ]
    },
    "q054": {
      "hitokoto": "The body may also be expressing a need for care",
      "body": "Continuing to feel unwell despite medical visits can be deeply difficult. First, receiving professional care is itself a way to value yourself.\n\nAlongside that, this reflection offers an energetic perspective: symptoms that persist may also carry a plea from the heart. Please understand me. Please care for me. I am trying so hard.\n\nIn this view, feelings can find expression through the body when they cannot come out through the heart. A harsh inner voice may prevent recognition or rest, leaving the body to appeal for care.\n\nToday, try thanking your body for all it does.",
      "toi": "What feeling might this discomfort be asking you to notice? Listen gently for a moment.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-11-15",
          "title": "The meaning of an illness that does not readily improve",
          "id": "20251115_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2024-11-21",
          "title": "What persistent symptoms may be expressing",
          "id": "20241121_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-06-15",
          "title": "When your body will not move as you wish",
          "id": "20260615_01"
        }
      ]
    },
    "q055": {
      "hitokoto": "Fear may be hiding beneath no time",
      "body": "You finish tasks quickly, but more appear, and the day ends in duty and responsibility. At such times, you may be unconsciously braking the part of you that wants to do something for yourself.\n\nWhat if it does not work? What if I do not get the result I imagine? Desire and fear can arise together.\n\nToday, gently disrupt the pattern of duties first and do one thing you enjoy before them. You are allowed to enjoy life, beyond producing results.",
      "toi": "When I say there is no time, what might I want to postpone? Look at the fear beneath it.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-08-13",
          "title": "The real reason behind wanting to do something but having no time",
          "id": "20250813_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-08-05",
          "title": "When you want to use busyness as a reason",
          "id": "20250805_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-12-02",
          "title": "Making inner space even when busy can help things work",
          "id": "20251202_01"
        }
      ]
    },
    "q056": {
      "hitokoto": "Let enjoyment be your reason for continuing",
      "body": "You may criticise yourself for giving up after a few days. But this need not mean you have a fickle character. If you are working from I must continue, your heart may not yet be involved.\n\nOften we want to become good quickly without enjoying the activity itself. If the excitement at the start was an image of a capable future self, motivation shrinks as soon as progress is hard to see.\n\nWhen you naturally continue, no special method is needed: you are doing what you love. Today, forget continuing and find one way to make it enjoyable.",
      "toi": "Do I want to continue because I want to become somebody, or because I simply like it? Be honest with yourself.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-04-08",
          "title": "How to move beyond giving up after three days",
          "id": "20250408_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-03-31",
          "title": "For those who cannot sustain anything they begin",
          "id": "20260331_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-05-26",
          "title": "What you need in order to keep going",
          "id": "20260526_01"
        }
      ]
    },
    "q057": {
      "hitokoto": "The light of living as yourself can be meaning enough",
      "body": "Anyone may have a time when life’s meaning becomes unclear. In nature, some beings live for many years and others for a short time. A short life is not therefore meaningless.\n\nNature does not think it must perform well or produce a result. Each being simply lives as itself. The light of that life is its meaning.\n\nHuman beings can think so much that meaning disappears from view. Today, step into the outside air for a little while. You may gradually return to the part of you that feels.",
      "toi": "Is it the mind searching for meaning, or the heart? Today, let the feeling part lead for a while.",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-12-05",
          "title": "When life’s meaning becomes unclear",
          "id": "20251205_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-11-01",
          "title": "The meaning of ordinary days when nothing happens",
          "id": "20251101_02"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2026-05-20",
          "title": "When you do not know what is troubling you",
          "id": "20260520_01"
        }
      ]
    },
    "q058": {
      "hitokoto": "Purpose is within you, rather than somewhere outside",
      "body": "The wish to know your purpose can be deeply sincere. Many people imagine it as a job, but purpose and work are not the same. Purpose is a way of living that delights your soul. Searching outside can quietly take years.\n\nIts core is to be, rather than to do. It may live in what feels natural, in the steady sense of joy or happiness you recognise.\n\nToday, set aside everyone’s evaluation and remember one moment when you felt at ease. Living as yourself becomes a role only you can fulfil.",
      "toi": "What do you keep doing even when no one is watching? Is the soul’s joy still there?",
      "sources": [
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-09-21",
          "title": "Purpose means living in a way that delights the soul",
          "id": "20250921_02"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-12-04",
          "title": "Your purpose lives in how you live",
          "id": "20251204_01"
        },
        {
          "media": "Ameblo blog · Japanese source",
          "date": "2025-06-10",
          "title": "Living as yourself fulfils your purpose",

    "q059": {
      "hitokoto": "Perhaps it is the heart that feels stopped",
      "body": "Feeling stuck can make you want to change places or people. Yet stagnation may arise from your own inner state. Put others first; do not show yourself: while those brakes remain, a new environment may bring the same pattern.\n\nThose brakes were often made from a wish to be loved. You need not blame yourself for them.\n\nInstead of urgently trying to change reality, savour one ordinary part of today. Sometimes reality starts moving when you stop trying to force it to change.",

      "hitokoto": "Luck can shift with where you place attention",

    "q062": {
      "hitokoto": "True spirituality does not require dependence",
      "body": "You may wonder why nothing changes after years of practice. The difficulty may lie in how spirituality is used. Some teachers offer another set of do this instructions. People accustomed to obeying parents or schools may follow them diligently, yet still never live as themselves.\n\nRestricting yourself as though in constant training can lower your energy. True spirituality contains no dependence.\n\nIt can help you adjust how to bring yourself fully to life, rather than make you follow someone else. The answer is within you.",

    "q063": {
      "hitokoto": "Care for your present state before making a wish",
      "body": "People often tell me they practise attraction but see no sign of a wish coming true. Its essence, in this perspective, is less wishing intensely than being the person who already lives that reality.\n\nIf awareness remains at I want it, meaning I do not have it yet, a reality of not having it is what continues. The state of your energy matters more than words or thoughts alone.\n\nBefore wishing, care for yourself as you are now. Find one thing in ordinary life that already feels enough to bring happiness. That may be the nearest doorway.",

    "q064": {
      "hitokoto": "Vibration rises as the heart and feelings move",
      "body": "Diligent people can feel they must raise their vibration. But this is not simply thinking positive thoughts or commanding energy to rise. In this view, it happens when the heart and emotions move.\n\nRejecting your true feelings lowers vibration. Anger is allowed too; feeling it carries more movement than feeling nothing. Desperately insisting on improvement may conceal the belief that your current self is not enough.\n\nToday, stop trying to raise anything and remember one thing that absorbed you as a child.",

      "body": "If you can recognise your dependence, that awareness is already an opening. Fear of losing something, of change, or of being alone can make holding on feel like the only choice.\n\nTelling yourself with the mind not to depend does not remove fear from the heart. Instead of punishing or shaming yourself, look at what you are afraid of.\n\nToday, pause the blame and stay beside that fear. Some of its shape may be an image created by thought.",

    "q066": {
      "hitokoto": "Your human qualities matter",
      "body": "Many people are anxious about AI and work. However efficiently AI handles administrative tasks, this reflection sees something different in the human heart that works with, nurtures, and cares for people.\n\nHuman qualities cannot simply be replaced. They may become more visible as technology grows. Expressing your energy through senses and feelings, and opening a path through your individuality, are part of being human.\n\nToday, bring one part of yourself into the place you are in and the work you do. You need not face the future through undirected fear alone.",

    "q067": {
      "hitokoto": "Answers grow within you",
      "body": "That feeling is natural. AI may respond with words that meet your emotions, and people who could not speak to anyone before may find relief in that response. That can be a good thing.\n\nYet there may be limits to what it can answer about a better way of living or a fundamental resolution. This reflection understands true empathy as resonance beyond words: the unspoken rhythm between breaths and heartbeats that belongs to living people.\n\nAfter talking to AI helps you feel lighter, offer those words to your own heart once more.",

<script>
(function(){
  const $=s=>document.querySelector(s);
  const cats=DATA.catalog.categories, items=DATA.catalog.items, answers=DATA.answers;
  const book=$('#book'), pl=$('#pl'), pr=$('#pr');
  let currentCat=null;

  function el(tag,cls,text){const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e;}
  function setPages(leftFn,rightFn,folioL,folioR){
    pl.innerHTML=''; pr.innerHTML='';
    leftFn(pl); rightFn(pr);
    pl.dataset.folio=folioL||''; pr.dataset.folio=folioR||'';
    [pl,pr].forEach(p=>{p.classList.remove('turn'); void p.offsetWidth; p.classList.add('turn'); p.addEventListener('animationend',()=>p.classList.remove('turn'),{once:true});});
    const y=book.getBoundingClientRect().top+window.scrollY-76;
    if(window.scrollY>y) window.scrollTo({top:y,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  }
  function tocList(list, arr, onPick, isItem){
    arr.forEach(c=>{
      const li=el('li'); const b=el('button'); b.type='button';
      b.appendChild(el('span','name',c.label||c.name));
      if(!isItem){ b.appendChild(el('span','hint', items.filter(i=>i.category===c.id).slice(0,2).map(i=>i.label.replace(/、/g,'')).join(' ／ ')+' and more')); }
      b.addEventListener('click',()=>onPick(c.id));
      li.appendChild(b); list.appendChild(li);
    });
  }
  // ---- TOC spread ----
  function showToc(){
    setPages(p=>{
      p.appendChild(el('p','kicker','Contents'));
      p.appendChild(el('h2','ptitle','What is on your mind?'));
      p.appendChild(el('p','plead','Choose what feels closest to your concern. Open a page of Michiyo’s words and a question to reflect on in your own time.'));
      const ul=el('ul','toc'); tocList(ul,cats.slice(0,6),openCat); p.appendChild(ul);
    }, p=>{
      p.appendChild(el('p','kicker','Contents'));
      const ul=el('ul','toc'); tocList(ul,cats.slice(6),openCat); p.appendChild(ul);
      const lk=el('div','links'); const r=el('button','textlink','Cannot choose? Draw a reflection'); r.type='button'; r.addEventListener('click',random); lk.appendChild(r); p.appendChild(lk);
    },'1','2');
  }
  // ---- items spread ----
  function openCat(id){
    currentCat=cats.find(c=>c.id===id);
    const list=items.filter(i=>i.category===id);
    const half=Math.ceil(list.length/2);
    setPages(p=>{
      const b=el('button','back','← Back to contents'); b.type='button'; b.addEventListener('click',showToc); p.appendChild(b);
      p.appendChild(el('p','kicker','Choose a concern'));
      p.appendChild(el('h2','ptitle',currentCat.name));
      p.appendChild(el('p','plead','Open the one that feels closest.'));
      const ul=el('ul','toc items'); tocList(ul,list.slice(0,half),openAns,true); p.appendChild(ul);
    }, p=>{
      p.appendChild(el('p','kicker',currentCat.name+' · Continued'));
      const ul=el('ul','toc items'); tocList(ul,list.slice(half),openAns,true); p.appendChild(ul);
      const lk=el('div','links'); const r=el('button','textlink','Cannot choose? Draw a reflection'); r.type='button'; r.addEventListener('click',random); lk.appendChild(r); p.appendChild(lk);
    },'3','4');
  }
  // ---- answer spread ----
  function openAns(id){
    const it=items.find(i=>i.id===id), a=answers[id]; if(!it||!a) return;
    currentCat=cats.find(c=>c.id===it.category);
    setPages(p=>{
      const b=el('button','back','← Back to the list'); b.type='button'; b.addEventListener('click',()=>openCat(currentCat.id)); p.appendChild(b);
      const ch=el('div','chosen'); ch.appendChild(el('p','lab','The concern you opened')); ch.appendChild(el('p','q','「'+it.label+'」')); p.appendChild(ch);
      p.appendChild(el('h2','hitokoto',a.hitokoto));
      const body=el('div','body');
      a.body.split('\n\n').filter(Boolean).forEach(text=>body.appendChild(el('p',null,text)));
      p.appendChild(body);
      p.appendChild(el('p','sign','── Michiyo'));
    }, p=>{
      p.appendChild(el('p','kicker','A question for reflection'));
      const tw=el('div','toi-wrap');
      tw.appendChild(el('p','toi-text',a.toi));
      tw.appendChild(el('p','toi-after','There is no need to hurry an answer. Carry this question with you for a while. The answer is within you.'));
      p.appendChild(tw);
      const src=el('div','src'); src.appendChild(el('h3',null,'Sources · Titles translated from Japanese'));
      const ul=el('ul'); (a.sources||[]).forEach(s=>{const li=el('li'); li.appendChild(el('span',null,s.media+' '+s.date)); li.appendChild(document.createTextNode(' 「'+s.title+'」')); ul.appendChild(li);}); src.appendChild(ul); p.appendChild(src);
      const lk=el('div','links');
      const b1=el('button','textlink','Explore another concern'); b1.type='button'; b1.addEventListener('click',showToc);
      const b2=el('button','textlink','Draw another reflection'); b2.type='button'; b2.addEventListener('click',random);
      lk.appendChild(b1); lk.appendChild(b2); p.appendChild(lk);
    },'5','6');
    history.replaceState(null,'','#'+id);
  }
  function random(){ openAns(items[Math.floor(Math.random()*items.length)].id); }

  function open(){ if(book.classList.contains('opened')) return; book.classList.add('opened'); }
  $('#cover').addEventListener('click',()=>{ open(); showToc(); });

  const h=location.hash.replace('#','');
  if(h&&answers[h]){ open(); openAns(h); }

  // footer
  $('#about').textContent=CONFIG.aboutText; $('#help').textContent=CONFIG.helpText; const support=el('a',null,'Yorisoi multilingual support in Japan');support.href='https://www.since2011.net/yorisoi/n2/';$('#help').appendChild(document.createTextNode(' '));$('#help').appendChild(support);
  const links=$('#links'); let any=false;
  [['substackUrl','substackLabel'],['portalUrl','portalLabel'],['privacyUrl','privacyLabel']].forEach(([u,l])=>{ if(CONFIG[u]){const a=el('a',null,CONFIG[l]); a.href=CONFIG[u]; a.rel='noopener'; links.appendChild(a); any=true;} });
  $('#quiet').textContent=any?CONFIG.quietText:''; $('#quiet').hidden=!any;

  // watercolour wash
  const cv=$('#water'), ctx=cv.getContext('2d'); const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; let W,H,t=0;
  const dark=()=>document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);
  function size(){W=cv.width=Math.floor(innerWidth*devicePixelRatio/2);H=cv.height=Math.floor(innerHeight*devicePixelRatio/2);} size(); addEventListener('resize',size);
  const seed=[[0.15,0.15,0.42,'a'],[0.88,0.28,0.36,'b'],[0.6,0.8,0.40,'a'],[0.08,0.85,0.30,'b']];
  function blob(cx,cy,r,k,ph){ctx.beginPath();const n=14;for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;const wob=1+0.14*Math.sin(a*3+ph+k)+0.09*Math.cos(a*5-ph*0.7+k*2);const x=cx+Math.cos(a)*r*wob,y=cy+Math.sin(a)*r*wob*0.86;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();}
  function draw(){ctx.clearRect(0,0,W,H);const d=dark();const cols=d?{a:'143,182,199',b:'170,150,130'}:{a:'127,166,184',b:'214,186,160'};const alpha=d?0.10:0.17;
    seed.forEach((s,i)=>{const ph=t*0.0025+i;const r=Math.max(W,H)*s[2]*(1+0.03*Math.sin(ph));const cx=s[0]*W+Math.sin(ph*0.6)*W*0.012,cy=s[1]*H+Math.cos(ph*0.5)*H*0.012;const g=ctx.createRadialGradient(cx,cy,r*0.1,cx,cy,r);g.addColorStop(0,`rgba(${cols[s[3]]},${alpha})`);g.addColorStop(0.7,`rgba(${cols[s[3]]},${alpha*0.45})`);g.addColorStop(1,`rgba(${cols[s[3]]},0)`);ctx.fillStyle=g;blob(cx,cy,r,i*1.7,ph);ctx.fill();ctx.strokeStyle=`rgba(${cols[s[3]]},${alpha*0.35})`;ctx.lineWidth=1.2;ctx.stroke();});
    t+=1; if(!reduce) requestAnimationFrame(draw);}
  draw();
})();
</script>
