<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F6F1EB">
<title>みちよのガイダンス（本）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap">
<style>
:root{
  --ground:#F6F1EB; --paper:#FFFDFA; --paper-2:#FBF7F2; --ink:#453F3C; --ink-soft:#7A716C; --ink-faint:#A69C96;
  --line:#E7DDD3; --water:#7FA6B8; --water-deep:#4E7A8E; --water-mist:#DCE8ED;
  --cover:#EFE6DC; --cover-2:#E6DACE; --shadow:rgba(70,55,40,.28); --focus:#4E7A8E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#181F23; --paper:#232B30; --paper-2:#1F272B; --ink:#EAE3DC; --ink-soft:#B9AFA7; --ink-faint:#877D76;
    --line:#35403F; --water:#8FB6C7; --water-deep:#A9CCDA; --water-mist:#25353C;
    --cover:#2A3338; --cover-2:#222A2E; --shadow:rgba(0,0,0,.6); --focus:#A9CCDA;
  }
}
:root[data-theme="dark"]{
  --ground:#181F23; --paper:#232B30; --paper-2:#1F272B; --ink:#EAE3DC; --ink-soft:#B9AFA7; --ink-faint:#877D76;
  --line:#35403F; --water:#8FB6C7; --water-deep:#A9CCDA; --water-mist:#25353C;
  --cover:#2A3338; --cover-2:#222A2E; --shadow:rgba(0,0,0,.6); --focus:#A9CCDA;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.9;letter-spacing:.02em;min-height:100vh;overflow-x:hidden;position:relative}
#water{position:fixed;top:-60px;left:-60px;width:calc(100% + 120px);height:calc(100% + 120px);z-index:0;pointer-events:none;filter:blur(20px);opacity:.9}
.mincho{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:40px 18px 70px}
.top{font-family:"Shippori Mincho",serif;font-size:11px;letter-spacing:.36em;color:var(--ink-faint);text-align:center;margin:0 0 18px}

/* ===== the book ===== */
.book{position:relative;perspective:2200px;margin:0 auto;max-width:940px}
/* cover */
.cover{position:relative;margin:0 auto;width:min(440px,100%);aspect-ratio:3/4.1;background:linear-gradient(135deg,var(--cover) 0%,var(--cover-2) 100%);border-radius:4px 14px 14px 4px;box-shadow:0 24px 50px -22px var(--shadow),0 2px 0 rgba(255,255,255,.35) inset,-6px 0 0 -3px var(--paper),-10px 0 0 -5px var(--cover-2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px 30px;cursor:pointer;transform-origin:left center;transition:transform 1s cubic-bezier(.4,.05,.2,1),opacity .9s ease;border:0;font:inherit;color:var(--ink)}
.cover::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:1px;background:rgba(0,0,0,.08)}
.cover::after{content:"";position:absolute;inset:18px;border:1px solid rgba(80,60,40,.14);border-radius:3px 10px 10px 3px;pointer-events:none}
.cover .eyebrow{font-family:"Shippori Mincho",serif;font-size:10.5px;letter-spacing:.36em;color:var(--ink-faint);margin-bottom:26px}
.cover h1{font-family:"Shippori Mincho",serif;font-weight:500;font-size:clamp(26px,5vw,32px);letter-spacing:.2em;margin:0 0 16px;line-height:1.6}
.cover .sub{font-family:"Shippori Mincho",serif;font-size:13.5px;color:var(--ink-soft);letter-spacing:.12em;line-height:2;margin:0}
.cover .open{margin-top:auto;font-family:"Shippori Mincho",serif;font-size:12.5px;letter-spacing:.3em;color:var(--water-deep);display:flex;flex-direction:column;align-items:center;gap:10px}
.cover .open::after{content:"";width:1px;height:26px;background:var(--water);opacity:.7;animation:drop 2.4s ease-in-out infinite}
@keyframes drop{0%,100%{transform:scaleY(.4);transform-origin:top;opacity:.3}50%{transform:scaleY(1);opacity:.9}}
.cover:hover{transform:rotateY(-6deg)}
.cover:focus-visible{outline:2px solid var(--focus);outline-offset:6px}
.book.opened .cover{transform:rotateY(-95deg);opacity:0;pointer-events:none;position:absolute;left:50%;top:0}
/* spread */
.spread{display:none;grid-template-columns:1fr 1fr;position:relative;background:var(--paper);border-radius:6px;box-shadow:0 30px 60px -28px var(--shadow),0 1px 0 var(--line)}
.book.opened .spread{display:grid;animation:reveal 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes reveal{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.spread::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:60px;margin-left:-30px;background:linear-gradient(90deg,transparent 0,rgba(70,50,30,.06) 45%,rgba(70,50,30,.10) 50%,rgba(70,50,30,.06) 55%,transparent 100%);pointer-events:none;z-index:2}
.page{position:relative;padding:44px 44px 40px;min-height:560px;display:flex;flex-direction:column;background:var(--paper)}
.page.l{border-radius:6px 0 0 6px;box-shadow:inset -1px 0 0 var(--line)}
.page.r{border-radius:0 6px 6px 0}
.page::after{content:attr(data-folio);position:absolute;bottom:16px;font-family:"Shippori Mincho",serif;font-size:10.5px;letter-spacing:.24em;color:var(--ink-faint)}
.page.l::after{left:44px}.page.r::after{right:44px}
/* page turn */
.page.turn{animation:turn .85s cubic-bezier(.3,.1,.2,1) both;transform-origin:left center}
.page.l.turn{animation-name:turnL;transform-origin:right center}
@keyframes turn{from{transform:rotateY(-24deg);opacity:0;box-shadow:-30px 0 40px -30px var(--shadow)}to{transform:none;opacity:1}}
@keyframes turnL{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.page.turn,.book.opened .spread,.cover,.cover .open::after{animation:none;transition:none}}
/* page typography */
.kicker{font-family:"Shippori Mincho",serif;font-size:11.5px;letter-spacing:.3em;color:var(--water-deep);margin:0 0 18px;display:flex;align-items:center;gap:12px}
.kicker::after{content:"";flex:1;height:1px;background:var(--line)}
.ptitle{font-family:"Shippori Mincho",serif;font-weight:500;font-size:22px;letter-spacing:.14em;margin:0 0 10px;line-height:1.6;text-wrap:balance}
.plead{font-size:13.5px;color:var(--ink-soft);line-height:2;margin:0 0 22px;max-width:28em}
.toc{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.toc button{appearance:none;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);text-align:left;font:inherit;color:var(--ink);cursor:pointer;padding:13px 26px 13px 0;position:relative;display:grid;grid-template-columns:1fr;row-gap:2px;transition:color .3s,padding-left .4s cubic-bezier(.2,.7,.2,1)}
.toc .name{font-family:"Shippori Mincho",serif;font-size:16px;letter-spacing:.08em;line-height:1.5}
.toc .hint{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.6}
.toc button::after{content:"";position:absolute;right:8px;top:50%;width:6px;height:6px;margin-top:-4px;border-top:1px solid var(--ink-faint);border-right:1px solid var(--ink-faint);transform:rotate(45deg);transition:border-color .3s,right .4s}
.toc button:hover,.toc button:focus-visible{color:var(--water-deep);padding-left:8px;outline:none}
.toc button:hover::after,.toc button:focus-visible::after{border-color:var(--water-deep);right:4px}
.toc.items button{padding:15px 26px 15px 0}
.toc.items .name{font-family:inherit;font-size:15px;letter-spacing:.03em;line-height:1.7}
.textlink{appearance:none;background:transparent;border:0;padding:6px 2px;color:var(--ink-soft);font:inherit;font-family:"Shippori Mincho",serif;font-size:13px;letter-spacing:.12em;cursor:pointer;border-bottom:1px solid var(--line);transition:color .3s,border-color .3s}
.textlink:hover,.textlink:focus-visible{color:var(--water-deep);border-bottom-color:var(--water);outline:none}
.links{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:auto;padding-top:26px}
.src+.links{margin-top:0;padding-top:22px}
.back{appearance:none;background:transparent;border:0;color:var(--ink-faint);font:inherit;font-family:"Shippori Mincho",serif;font-size:12.5px;letter-spacing:.12em;cursor:pointer;padding:0;margin:0 0 22px;align-self:flex-start}
.back:hover,.back:focus-visible{color:var(--water-deep);outline:none}
/* answer pages */
.chosen{border-left:1px solid var(--water);padding-left:16px;margin:0 0 24px}
.chosen .lab{font-size:11px;letter-spacing:.24em;color:var(--ink-faint);margin:0 0 4px}
.chosen .q{font-family:"Shippori Mincho",serif;font-size:15px;color:var(--ink-soft);margin:0;line-height:1.8}
.hitokoto{font-family:"Shippori Mincho",serif;font-size:21px;font-weight:500;letter-spacing:.1em;line-height:1.75;margin:0 0 28px;padding-bottom:22px;border-bottom:1px solid var(--line);text-wrap:balance}
.body{font-size:14.5px;line-height:2.05;margin:0}
.body p{margin:0 0 1.35em}
.body p:last-child{margin-bottom:0}
.sign{font-family:"Shippori Mincho",serif;color:var(--ink-soft);font-size:13px;letter-spacing:.16em;margin:8px 0 0;text-align:right}
.toi-wrap{margin:auto 0;padding:10px 0 40px}
.toi-text{font-family:"Shippori Mincho",serif;font-size:20px;line-height:2.05;letter-spacing:.08em;margin:0 0 20px;text-wrap:balance}
.toi-after{font-size:12.5px;color:var(--ink-soft);line-height:2;margin:0}
.src{margin:auto 0 0;padding-top:18px;border-top:1px solid var(--line)}
.src h3{font-family:"Shippori Mincho",serif;font-size:11px;letter-spacing:.26em;color:var(--ink-faint);margin:0 0 8px;font-weight:400}
.src ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.src li{font-size:11.5px;color:var(--ink-soft);line-height:1.7}
.src li span{color:var(--ink-faint);font-variant-numeric:tabular-nums}
/* footer */
footer{max-width:720px;margin:56px auto 0;padding-top:24px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);line-height:2}
footer p{margin:0 0 12px}
footer .about{color:var(--ink);font-size:13px}
footer a{color:var(--water-deep);text-decoration:none;border-bottom:1px solid var(--water-mist)}
.help{font-size:12px;color:var(--ink-faint)}
.foot-links{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:6px}
.copy{font-family:"Shippori Mincho",serif;font-size:11px;letter-spacing:.2em;color:var(--ink-faint);margin-top:22px;text-align:center}
/* mobile: pages stack */
@media (max-width:720px){
  .wrap{padding:28px 12px 60px}
  .spread{grid-template-columns:1fr}
  .spread::before{display:none}
  .page{padding:34px 26px 34px;min-height:0}
  .page.l{border-radius:6px 6px 0 0;box-shadow:inset 0 -1px 0 var(--line)}
  .page.r{border-radius:0 0 6px 6px}
  .page.turn{animation-name:slide}
  @keyframes slide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
  .page::after{bottom:12px}
  .book.opened .cover{display:none}
}
</style>

</head>

54", "category": "cat10", "label": "体の不調が、なかなか良くならない"}, {"id": "q055", "category": "cat10", "label": "やりたいことがあるのに、時間がない"}, {"id": "q056", "category": "cat10", "label": "何を始めても、続かない"}, {"id": "q057", "category": "cat11", "label": "何のために生きているのか、わからなくなる"}, {"id": "q058", "category": "cat11", "label": "自分の使命が、知りたい"}, {"id": "q059", "category": "cat11", "label": "人生が、止まっている気がする"}, {"id": "q060", "category": "cat11", "label": "自由がない、と感じる"}, {"id": "q061", "category": "cat11", "label": "自分は運が悪い、と思ってしまう"}, {"id": "q062", "category": "cat12", "label": "何年スピリチュアルをやっても、変わらない"}, {"id": "q063", "category": "cat12", "label": "引き寄せが、うまくできない"}, {"id": "q064", "category": "cat12", "label": "波動を上げなきゃ、と焦ってしまう"}, {"id": "q065", "category": "cat12", "label": "誰かや何かに、依存してしまう"}, {"id": "q066", "category": "cat12", "label": "AIに仕事を奪われるのではないかと、不安"}, {"id": "q067", "category": "cat12", "label": "AIに悩みを相談することが、少し怖い"}]}, "answers": {"q001": {"hitokoto": "「嫌われたくない」は自分を愛しましょうのサイン", "body": "「嫌われたくなくて、\n言いたいことが言えない」\n\nそんな苦しさを抱えている人は、\n少なくないのです。\n\n「とにかく嫌われたくない」は、\n実は他者のことではなく、\n自分自身が自分を嫌っている時に\n出てくる感覚だったりします。\n\n自分が自分にＯＫしていないから、\n誰かの「好意」をもらって\n安心したくなるのですね。\n\nでも、自然に好かれる人は\n好かれようとしていません。\n\n無理していない＜正直さ＞が、\n人に心地よさを与えるからなのです。\n\n正直な気持ちを伝えることは、\n「わたしはこんな人ですよ」という\nあなたの名刺のようなもの。\n\n今日はひとつだけ、\n思ったことを言葉にしてみてください。", "toi": "「言えない」の奥にいるのは、嫌う相手か、自分を嫌っている自分か。少しだけ見つめてみる。", "sources": [{"media": "Amebloブログ", "date": "2024-08-18", "title": "８月１８日 「とにかく嫌われたくない」は自分を愛しましょうのサイン", "id": "20240818_01"}, {"media": "Amebloブログ", "date": "2025-02-14", "title": "２月１４日　自然に好かれる人は好かれようとしていない", "id": "20250214_01"}, {"media": "Amebloブログ", "date": "2026-01-08", "title": "正直に気持ちを伝えても嫌われない", "id": "20260108_01"}]}, "q002": {"hitokoto": "困らせてくる人は、あなたの内側の鏡", "body": "「職場の人間関係が、\nどうしてもしんどい」\n\nご相談の中でも、\nこれはダントツに多いのです。\n\n会社は、年齢も境遇も違う人が\n仕事という共通の利害で\n集まっている場所。\n\nそこで長引くのは、\n業務そのものよりも\n「わかってほしい」という\n気持ちのぶつかり合いだったりします。\n\nそしてあなたを困らせる人は、\n＜あなたの内側を見せてくれる鏡＞\nでもあるのです。\n\n「思ったことを言ってはいけない」\nと押さえている時ほど、\nあけすけに言い放つ人が\n目の前に来たりするのですね。\n\n今日はひとつだけ、\n「この人は何を恐れているのか」\nと眺めてみてください。\n\n相手を変えようとするより、\n先に景色が変わっていったりします。", "toi": "いまその人たちと同じ場所にいることの意味。相手を通して、自分の何が揺れているのか。", "sources": [{"media": "Amebloブログ", "date": "2024-06-09", "title": "６月９日 職場の人間関係で辛いと感じる時に知っておいてほしいこと", "id": "20240609_01"}, {"media": "Amebloブログ", "date": "2024-10-17", "title": "１０月１７日 会社の人間関係はクールで泥臭い", "id": "20241017_01"}, {"media": "Amebloブログ", "date": "2026-05-12", "title": "人間関係の辛さに向き合うと起こること", "id": "20260512_01"}]}, "q003": {"hitokoto": "苦手の中には、いつも「自分」がいます", "body": "「どうしても、\nあの人が苦手」\n\n避けたいのに、\nなぜか目の前にいる。\n\nそんなことがありますね。\n\nでも「苦手な人」を避けたところで、\n関係は変わらないどころか、\nもっとこじれていったりします。\n\nこんな時は、\n「わたしはなぜこの人が苦手なんだろう」\nと自問してみてください。\n\n心の些細な声を言語化していくと、\n「自分にはできないことを\n堂々とやっている」といったものが\n見えてきたりします。\n\n苦手と感じるところに、\n自分が真に求めていることや、\n遠慮してきたことが\n隠れていたりするのですね。\n\nその感情は相手が起こすものではなく、\nもともと自分の中にあったものが\n触発されているだけなのです。", "toi": "その人の何が、いちばん引っかかるのか。そこに、自分が我慢してきたものが置いてある。", "sources": [{"media": "Amebloブログ", "date": "2025-11-11", "title": "１１月１１日　苦手な人が近寄らなくなる究極の方法", "id": "20251111_02"}, {"media": "Amebloブログ", "date": "2025-05-29", "title": "５月２９日　苦手な人の中に見える「本当のあなた」", "id": "20250529_01"}, {"media": "Amebloブログ", "date": "2026-02-28", "title": "苦手嫌いの先にあるものに気付くと自分を好きになれる", "id": "20260228_02"}]}, "q004": {"hitokoto": "人ではなく、自分の判断にＹＥＳを", "body": "「頼まれると、\nどうしても断れない」\n\n断れないのは、\n相手を傷つけたくない、\n嫌な人だと思われたくない、\n\nつまり「関係を壊したくない」\nという気持ちからなのですね。\n\nでも、嫌なことを我慢しないと\n繋がれない関係は、\n＜本当の絆＞ではないのです。\n\nそしてＮＯで壊れる関係なら、\nきっとそれは\n本当の関係ではなかったのですね。\n\n自分の「ＮＯ」に自分がＹＥＳと\n言えていない時ほど、\nその「ＮＯ」は相手にも通じません。\n\nＮＯは、あなたの心地よさ、\nつまり境界線を守るための\n＜ポジティブな意志表明＞なのですね。\n\n人にではなく、自分の判断に\nＹＥＳと言ってあげること。\n\n今日は小さなことをひとつ、\n「わたしはどうしたいか」で\n決めてみてください。", "toi": "いまのＹＥＳは、望みから出たＹＥＳか、嫌われないためのＹＥＳか。そこだけ分けてみる。", "sources": [{"media": "Amebloブログ", "date": "2024-09-13", "title": "９月１３日 自分の判断にYESを言うと他者にNOを言えるようになる", "id": "20240913_01"}, {"media": "Amebloブログ", "date": "2024-02-27", "title": "２月２７日　NOを言える自分になると元気になる", "id": "20240227_01"}, {"media": "Amebloブログ", "date": "2025-01-31", "title": "１月３１日　自分の境界線の守り方＜ＮＯと言っていい＞", "id": "20250131_02"}]}, "q005": {"hitokoto": "いま気遣うのは、相手ではなく自分自身", "body": "「人の機嫌に、\n振り回されてしまう」\n\nそう感じるのは、\nあなたが敏感だからなのです。\n\n相手のエネルギーを\n先に読めてしまうから、\n自分より相手を優先して、\n気づいたら無理をしている。\n\nそんな時こそ、\nいま気遣わなければならないのは\nその相手ではなく、\n自分自身だったりします。\n\nエネルギーを自分の中に戻すと\n土台が強化されて、\n他者に意識を持っていかれにくくなります。\n\nそして、感情は溜めないこと。\nノートに書き出すのでも、\nカラオケでもいいのです。\n\n敏感さは、憎むべきものではなく、\nあなたの個性のひとつ。\n\nそう思って嫌わないでいると、\nだんだん生きやすくなっていきます。", "toi": "いま、わたしはどう感じているのか。相手の顔色を読む前に、一度だけ自分の顔色を見てみる。", "sources": [{"media": "Amebloブログ", "date": "2024-11-19", "title": "１１月１９日 周りの影響を受けすぎてしまう時に知ってほしいこと", "id": "20241119_02"}, {"media": "Amebloブログ", "date": "2024-05-14", "title": "５月１４日 相手のネガティブ発言につられなくなる方法", "id": "20240514_01"}, {"media": "Amebloブログ", "date": "2025-06-22", "title": "６月２２日　敏感さを愛すると生きやすくなる", "id": "20250622_01"}]}, "q006": {"hitokoto": "期待したくなる時は、自分が弱っている時", "body": "「期待していたのに、\n裏切られた気がする」\n\nそんな思いをしたことのある人は、\nきっと多いと思います。\n\n＜期待＞は、\n自分で自分を幸せにすることを\n少し放棄している時に、\nかけたくなるものなのです。\n\n「察して動いてほしい」\n「わたしの願いを叶えてほしい」\n\nそんな他力本願になっている時、\n自分自身は弱っているので、\n裏切られた時のダメージも\n大きくなってしまうのですね。\n\n他者は、なんでも思ったように\n動いてくれる存在ではないのです。\n\nだから今日は、相手ではなく\n「期待してしまうほど弱っている自分」\nに優しさを向けてみてください。\n\n自分に力が戻ってくると、\n誰かの反応で揺れなくなっていきます。", "toi": "その期待は、本当は自分が自分にしてあげたかったことなのかもしれません。誰に向けた願いだったのか。", "sources": [{"media": "Amebloブログ", "date": "2025-10-30", "title": "１０月３０日　人に期待して裏切られた時に考えること", "id": "20251030_01"}, {"media": "Amebloブログ", "date": "2026-03-27", "title": "傷つけられた！と感じた時に気づいてほしいこと", "id": "20260327_01"}]}, "q007": {"hitokoto": "苦しいのは比べたからではなく、劣等感から", "body": "「あの人はあそこまでいっているのに、\nわたしはまだここにいる」\n\nそう感じること、\n人間なら誰にでもありますね。\n\n「比べる」こと自体は、\n悪いことではないのです。\n\n他者を見て学ぶこともできますから。\n\n苦しくなるのは、\n比べたからではなく、\n＜劣等感＞から見ているから\nだったりします。\n\nしかも、比べている相手の暮らしは、\n外から見えないところで\nそれぞれに悩みを抱えています。\n\n比べている対象のほうが、\n幻想かもしれないのですね。\n\n比べている間、意識は\n＜自分の外側＞に向いています。\n\n他の人の庭を気にしている間、\n自分の庭に水がやれていないのです。\n\n今日は、落ち込んだ自分のほうに\nそっと寄り添ってみてください。", "toi": "いま水をやりたいのは、誰の庭なのか。その落ち込みは、本当は何を欲しがっているのか。", "sources": [{"media": "Amebloブログ", "date": "2024-09-29", "title": "９月２９日 人と比べて苦しい時に知ってほしいこと", "id": "20240929_01"}, {"media": "Amebloブログ", "date": "2025-10-24", "title": "１０月２４日　他者の暮らしと自分を比べて苦しくなった時に知ってほしいこと", "id": "20251024_01"}, {"media": "Amebloブログ", "date": "2026-04-25", "title": "「人と比べる」のをやめると見えてくること", "id": "20260425_01"}]}, "q008": {"hitokoto": "自分がＯＫしていないと、苦しくなるのです", "body": "「認めてもらえないと、\nどうしても苦しい」\n\n人間はそもそも、\n認められたい生き物なのです。\n\nそれはある意味の「栄養」なので、\n求めること自体は悪くありません。\n\nただ「認められないと苦しい」\nとなっている時は、\n少し依存の状態かもしれません。\n\nそして、自分がわからなくなる\n一番の原因は、\n自分に対する＜厳しさ＞だったりします。\n\n人は他者にはしないことを、\n自分にだけは容赦なくやるのですね。\n\n自分が自分にＯＫしていない時には、\nどんなに外で頑張っても、\nそのＯＫは届きにくいのです。\n\n今日は、自分の言動を\n「他者のこと」だと思って\n眺めてみてください。\n\nそこに共感が生まれたら、\nそれが「認める」ということなのです。", "toi": "いちばん認めてほしかったのは、誰からだったのか。その相手は、もう自分の中にいるのかもしれません。", "sources": [{"media": "Amebloブログ", "date": "2024-08-20", "title": "８月２０日 人から認められないと苦しくなる時", "id": "20240820_01"}, {"media": "Amebloブログ", "date": "2024-07-01", "title": "７月１日 自分を認めると他者からも認められる", "id": "20240701_01"}, {"media": "Amebloブログ", "date": "2025-06-02", "title": "６月２日　人が頑張るのは「誰かが見てくれている」から", "id": "20250602_01"}]}, "q009": {"hitokoto": "嫉妬は、無理していますよのお知らせ", "body": "「人の幸せを、\n素直に喜べない」\n\nそんな自分を、\n醜いと思ってしまうかもしれません。\n\nでも嫉妬は、\n「自分に無理をさせているとき」に\n起こるものなのです。\n\nお腹が空くとお腹が鳴るのと同じ、\nある意味の生理現象だったりします。\n\n必死で頑張っている横に、\nありのままで愛されている人がいたら、\n心は動きます。\n\nむしろ「こんな自分は醜い」と\nジャッジするほど、\nエネルギーが下がって、\nもっと反応してしまうのですね。\n\nその背景には、\n「自分はダメ」という思いが\n隠れていたりします。\n\nそして誰かに「すごいな」と\n感じられるということは、\n同じものがあなたの中にもあるから\nだったりするのですよ＾＾", "toi": "「いいな」と感じたその中身は、本当は自分もそうありたかったこと。どこで無理をしてきたのか。", "sources": [{"media": "Amebloブログ", "date": "2025-08-29", "title": "８月２９日　嫉妬心が起こるのは心が弱っているサイン", "id": "20250829_01"}, {"media": "Amebloブログ", "date": "2024-11-22", "title": "１１月２２日 嫉妬心は不足感のお知らせ（嫌わなくていい）", "id": "20241122_02"}, {"media": "Amebloブログ", "date": "2026-05-31", "title": "他者の中に見える素晴らしさをあなたにも見つける", "id": "20260531_01"}]}, "q010": {"hitokoto": "反省という名のダメ出しは、しないこと", "body": "「あのときこうすればよかった」\n\nそうやって、寝る前に\nぐるぐるしてしまうことがあります。\n\n一見、真面目で誠実に見えますが、\n＜反省という名のダメ出し＞は、\n自分のエネルギーに傷をつけて、\n後悔と罪悪感を大きくしていきます。\n\nそうすると次に動こうとした時に\n身がすくんでしまい、\nまた自分にダメ出しをすることに\nなったりするのですね。\n\n振り返りは本来、\n「次に活かすため」のもの。\n\n「次はこうしよう」と気づいたら、\nそこで終わりにするものなのです。\n\n今日は寝る前に、\n「今日もよくやった」と\n自分を労ってあげてください。\n\nどうせエネルギーを使うのなら、\n明日に役立つ形にしていきましょう。", "toi": "その言葉を、大切な誰かに毎晩言い続けたらどうなるか。それを自分は、自分に言っている。", "sources": [{"media": "Amebloブログ", "date": "2024-07-22", "title": "７月２２日 反省という名の「ダメ出し」はしない", "id": "20240722_01"}, {"media": "Amebloブログ", "date": "2026-02-01", "title": "よりよく生きたければ反省の習慣をやめる", "id": "20260201_01"}, {"media": "Amebloブログ", "date": "2026-06-18", "title": "寝る前の反省の習慣をやめると起こること", "id": "20260618_01"}]}, "q011": {"hitokoto": "本当の自信は、静かに自分とともにある力", "body": "「どうしても、\n自信が持てない」\n\n「自信があればできるのに」\nと感じることがありますね。\n\nでも、本当の自信があるときは、\n「自信がある・ない」という\n論の場所に、そもそもいないのです。\n\n何かができるから、\n評価されているから、、、\n\nそんな条件でつけた自信は、\nそれが無くなった時に\n一緒に剥がれていきます。\n\n本当の自信は、自分の中の＜土台＞。\n\n人の目線がどうであろうと\n関係のない場所で、ひっそりと\n「自分とともにある力」のことなのです。\n\nだから、あるかないかで\n自分を判断するのをやめて、\n今日の自分を大切にしてみてください。\n\n自分が自分とともに生きた長さと\n比例して、それは育っていきます。", "toi": "「自信がついたら」の先に置いているものは何か。それは今日の自分では触れられないものなのか。", "sources": [{"media": "Amebloブログ", "date": "2025-10-17", "title": "１０月１７日　本当の自信の育て方", "id": "20251017_01"}, {"media": "Amebloブログ", "date": "2024-10-30", "title": "１０月３０日 盛る自信と盛らなくてもゆるぎない自信", "id": "20241030_01"}]}, "q012": {"hitokoto": "自分らしさは、なんでもないことの中に", "body": "「自分らしさって、\nなんだろう」\n\nそう感じたこと、ありますね。\n\n「自分らしさ」は、\n特別な才能や、\nはっきりしたビジョンのことではなく、\nもっとずっと身近なところに\nあるものだったりします。\n\n誰かと話していて、\n気づいたら熱くなっている話題。\n\n頼まれていないのに、\nついやってしまうこと。\n\n理由はないけれど、\nなんとなく続いていること。\n\nそういう「なんでもないこと」の中に、\n＜あなたらしさのかけら＞が\nちりばめられているのです。\n\nきちんと言葉にできなくていいのです。\n\n「これをしていると、\nなんかわたしっぽいな」\n\nその小さな感覚を、\n流さずに拾い上げてみてください。", "toi": "今日ひとつ、理由もなく心が動いたもの。その小さな感覚の中に、もう「わたし」が置いてある。", "sources": [{"media": "Amebloブログ", "date": "2026-06-14", "title": "「自分らしい」って何？簡単な「自分らしさ」の見つけ方", "id": "20260614_01"}, {"media": "Amebloブログ", "date": "2025-06-24", "title": "６月２４日　自分がわからなくなっている時には感覚を使う", "id": "20250624_01"}, {"media": "Amebloブログ", "date": "2024-09-25", "title": "９月２５日 何者かではなく自分になると光り輝く", "id": "20240925_01"}]}, "q013": {"hitokoto": "わからないのは、感じる力が疲れているサイン", "body": "「やりたいことが、\nわからない」\n\nそう焦ってしまうこと、\nあるかもしれません。\n\nでも「やりたいことがわからない」は、\nやりたいことがない、\nということではなく、\n＜感じる力が疲れているサイン＞\nだったりします。\n\nずっと頑張ってきた人ほど、\n「好き」よりも「すべき」を\n優先してきたのですね。\n\n「やりたいこと」は、\n見つけるものではなく、\n勝手にやってしまうもの。\n\nだから探しに行くほど、\n見つからない沼にはまるのです。\n\n今日は、はっきり「好きかどうか」より、\n「なんとなく気持ちいいかどうか」で\nひとつ選んでみてください。\n\nそんな緩さを日常に入れていくと、\n静かに顔を出してきます。", "toi": "いま、なんとなく気持ちいいのはどちらか。頭より先に、体が知っているのかもしれません。", "sources": [{"media": "Amebloブログ", "date": "2026-06-02", "title": "やりたいことがわからない時", "id": "20260602_01"}, {"media": "Amebloブログ", "date": "2024-11-25", "title": "１１月２５日 やりたいことが見つからない時にやりたいことを探しに行くのは逆効果", "id": "20241125_01"}, {"media": "Amebloブログ", "date": "2025-11-19", "title": "１１月１９日　やりたいが見つからないときにすべきこと", "id": "20251119_01"}]}, "q014": {"hitokoto": "自分を愛するとは、追い込んでいない状態", "body": "「自分を愛する、が\nどういうことかわからない」\n\nそう感じている人は、\nとても多いのです。\n\n「自分を愛する」は、\n甘やかすことでも、\nわがままを許すことでもありません。\n\n「〇〇をしたら愛したことになる」\nという条件ではなく、\n無条件に自分を受け入れている状態。\n\nすごく簡単に言えば、\n「自分を追い込んでない状態」\nなのかもしれません。\n\nだから、やり方を探すよりも、\n普段どんな意識で\n自分に向き合っているかを\n聴いてみてください。\n\nジャッジしたり、責めたり、\n恥じていたりしたら、\nその厳しさを少し緩めてあげる。\n\n「愛さなきゃ」となっている自分すら\nＯＫにするのが、無条件なのです。", "toi": "自分にかけているその言葉を、小さな子にも毎日かけられるか。その差の分だけ、厳しくしている。", "sources": [{"media": "Amebloブログ", "date": "2024-08-26", "title": "８月２６日 「自分を愛する」の本当の意味を理解する", "id": "20240826_01"}, {"media": "Amebloブログ", "date": "2024-06-17", "title": "６月１７日 自分を愛するための最も具体的な方法", "id": "20240617_01"}, {"media": "Amebloブログ", "date": "2025-11-25", "title": "１１月２５日　「自分を愛する」が強迫観念になってしまう時", "id": "20251125_01"}]}, "q015": {"hitokoto": "レーダーを、自分自身に向け変えるだけ", "body": "「気づけば、いつも\n人の顔色をうかがっている」\n\n人はもともと、\n生まれた時は「自分軸」なのです。\n\nでも、周りに合わせないと\nこの世界では共存しにくいと学習して、\nだんだん他人軸になっていきます。\n\n特に感性の鋭い人は、\n他者のエネルギーを読めてしまうので、\nそれが普通になっていくのですね。\n\nだから、他人軸だった自分を\n責めないでいてください。\n\n責めるほど、軸は外に出ていきます。\n\nやることはひとつだけ。\n\n他者に向けていたレーダーを、\n自分自身に向け変えることなのです。\n\n今日、一回でいいので\n「わたしはいま、どう感じているか」\nと自分に聞いてみてください。\n\n一ミリでも、十日で一センチ。\n軸はそうやって育っていきます。", "toi": "人の顔色はあんなに見えるのに、自分の顔色はどうか。いま、どんな表情をしているのか。", "sources": [{"media": "Amebloブログ", "date": "2025-09-09", "title": "９月９日　他人軸で生きていた自分を受け入れると自分軸に戻れる", "id": "20250909_02"}, {"media": "Amebloブログ", "date": "2026-04-12", "title": "子供の頃から相手の顔色を見て心を読んできた人たちへ", "id": "20260412_01"}, {"media": "Amebloブログ", "date": "2026-05-23", "title": "自分軸は毎日少しずつのエネルギーの積み重ねで作られる", "id": "20260523_01"}]}, "q016": {"hitokoto": "いちばんつらいのは、つらいと言えないこと", "body": "「生きているのが、\nなんだかしんどい」\n\nそう感じること、\n人生で一度くらいはあるかもしれません。\n\nつらさの中で最もつらいのは、\nそのつらさを\n「誰にも言えないこと」だったりします。\n\nだから、つらい時に\n「つらい」と言えるのなら、\nそれはとてもいいことなのです。\n\nそして生きづらさの元にあるのは、\n実は＜真面目さ・責任感＞\nであることが多いのですね。\n\n「ああしなければ」という命令を\n自分に下し続けている時、\nありのままの自分は\n元気をなくしていきます。\n\n普段はしない、できないと\n思っていたことをひとつ許すだけでも、\nエネルギーは緩んでいきます。\n\n体がしんどい時は、\n専門家にみてもらうことも、\n自分を大切にすることなのです。", "toi": "いま「つらい」とひとことだけ言うとしたら、誰に言うか。その人の顔を、思い浮かべてみる。", "sources": [{"media": "Amebloブログ", "date": "2024-08-31", "title": "８月３１日 生きづらいと感じたらやってみてほしいこと", "id": "20240831_01"}, {"media": "Amebloブログ", "date": "2024-09-08", "title": "９月８日 生きづらさはインナーチャイルドの苦しみの表現", "id": "20240908_01"}, {"media": "Amebloブログ", "date": "2025-02-08", "title": "２月８日　ＨＳＰだから生きづらい…わけじゃない", "id": "20250208_01"}]}, "q017": {"hitokoto": "スイッチが入らないのは、サインです", "body": "「休み明け、どうしても\n\n仕事のスイッチが入らない」\n\nそんな自分を、つい\n\n責めてしまうかもしれません。\n\nでも、これは怠けているとか\n\nダメだということではないのです。\n\n楽しい仕事のスイッチは\n\nすんなり入るのに、\n\n楽しくない仕事は、年々\n\n入るのが遅くなっていく。\n\nそれは今のお仕事が\n\n「お腹いっぱい」という\n\nサインなのかもしれません。\n\n惰性でもなんとかなっている。\n\nそんな時こそ、今の仕事に\n\nかけているエネルギー量が\n\n見えていたりします。\n\n無理に気分を上げようとせず、\n\nまずは、義理や義務だけに\n\nなっていた自分に気づくこと。\n\nそして今日は少しだけ、\n\n自分のためになることを\n\nしてあげてくださいね。", "toi": "今の仕事に、自分はどれくらいのエネルギーをかけていたいのか。惰性の奥にある本音を、少しだけ見てみる。", "sources": [{"media": "Amebloブログ", "date": "2026-01-05", "title": "仕事のスイッチがなかなか入らない時に知ってほしいこと", "id": "20260105_01"}, {"media": "Amebloブログ", "date": "2025-10-16", "title": "１０月１６日　やる気が起きない時に知ってほしいこと", "id": "20251016_02"}, {"media": "Amebloブログ", "date": "2026-04-06", "title": "やる気が起きない自分を責めている人へ", "id": "20260406_01"}]}, "q018": {"hitokoto": "好きが先で、仕事はあとから来る", "body": "「好きなことを、\n\n仕事にできたらいいのに」\n\nそう思っている人は、\n\nとても多いのです。\n\nでも、趣味がいきなり\n\n仕事になるかというと、\n\nそうではないですよね。\n\n実際に「好きなことが\n\n仕事になる」時とは、\n\n最初から「仕事にしよう」と\n\n思っていない時のほうが\n\n多かったりします。\n\n趣味が仕事になったのは\n\n結果であって、目的ではない\n\nということなのです。\n\nエネルギーで見れば、\n\n「好き」はとても大きな\n\n愛の波動を放っているもの。\n\nその波動に、人は動きます。\n\n今日はまず「仕事」の部分を\n\nいったん忘れて、\n\n「好き」だけに触れてみる。\n\nその情熱が、何か月も何年も\n\n自分を続けさせてくれるのです。", "toi": "時間や寝食を忘れるほど楽しいことは、何だったか。自分の「好き」のほうを、先に見つけてみる。", "sources": [{"media": "Amebloブログ", "date": "2025-12-13", "title": "１２月１３日　「好きなことを仕事にしたい」人に知ってほしいこと", "id": "20251213_01"}, {"media": "Amebloブログ", "date": "2024-04-27", "title": "４月２７日 「好き」が入っているものは売れる", "id": "20240427_01"}, {"media": "Amebloブログ", "date": "2025-09-02", "title": "９月２日　「好きこそものの上手なれ」を極めるとうまくいく", "id": "20250902_01"}]}, "q019": {"hitokoto": "キャリアは、固めなくていいのです", "body": "「この先のキャリアが、\n\nまったく描けない」\n\nそんな不安を感じている人は、\n\n少なくないのです。\n\nでも今は、ＡＩの台頭で\n\n「１年後の世界」が\n\n今とは全然違っている\n\n可能性が高い時代。\n\nビジョンを先に描くことが\n\n難しいのは、\n\nあなたのせいではないのです。\n\nだから、職業としての\n\nキャリアではなく、\n\n＜エッセンスとしての\n\nキャリア＞を見てみる。\n\nどんな仕事をしていようと、\n\nこんな暮らし、こんな生き方を\n\nしていきたいという感覚。\n\nそこから逆に考えるのです。\n\nそのヒントは、実は\n\n今やっていることの中に\n\nあったりします。\n\n未来をガッチリ固めるより、\n\n楽しく柔軟な視点から\n\n眺めてみるといいのです。", "toi": "どんな仕事をしていても、こういう暮らしがしたい。その一行を、自分の言葉で置いてみる。", "sources": [{"media": "Amebloブログ", "date": "2025-11-04", "title": "１１月４日　今キャリアを明確に描かなくてもいい理由", "id": "20251104_01"}, {"media": "Amebloブログ", "date": "2026-01-28", "title": "理想の働き方は今の仕事の中にヒントがある", "id": "20260128_01"}, {"media": "Amebloブログ", "date": "2025-07-17", "title": "７月１７日　キャリアのしくじりは「新しい転換」を起こすためのサイン", "id": "20250717_01"}]}, "q020": {"hitokoto": "その疲れは、外を見ている合図です", "body": "「こんなに頑張っているのに、\n\nなぜか報われない」\n\nそう感じること、\n\nありますよね。\n\n頑張っている人ほど、\n\n自分が「頑張りすぎ」だと\n\nいうことを知りません。\n\nむしろ「まだまだ足りない」と\n\n思っていたりします。\n\n頑張ってきたのは、\n\n褒められよう、認められようと\n\nまっすぐ走ってきたから。\n\nそれが生きる正解だと\n\n思っていたのですね。\n\nでも、どんなに頑張っても\n\n認められた気がしないのは、\n\n自分自身が自分を\n\nＯＫと思っていないから\n\nだったりします。\n\nその疲れは、意識が\n\n外側に行っている時の\n\n典型的な感覚なのです。\n\n今日はひとつ、自分で自分に\n\n「よくやってるね」と\n\n言ってあげてくださいね。", "toi": "そこまで頑張って欲しかったのは、誰からの、どんな言葉だったのか。その言葉を、自分で自分に。", "sources": [{"media": "Amebloブログ", "date": "2025-06-14", "title": "６月１４日　頑張りすぎる人はまず頑張りすぎの原因を知る", "id": "20250614_02"}, {"media": "Amebloブログ", "date": "2025-07-28", "title": "７月２８日　「頑張りすぎ」のサインの見極め方", "id": "20250728_02"}, {"media": "Amebloブログ", "date": "2024-02-01", "title": "２月１日　抱え込みがちの人が最も優先すべきもの", "id": "20240201_01"}]}, "q021": {"hitokoto": "力を抜くのは、無責任ではないのです", "body": "「わたしがやらなければ」\n\n「ここで手を抜いたら\n\n迷惑をかけてしまう」\n\nそんな風に、限界を超えても\n\n手を離せなくなることが\n\nあるかもしれません。\n\n責任感は本来、\n\n＜愛からくるもの＞。\n\n自分が信じるものに\n\nエネルギーをかけることだったりします。\n\nでもそれが怖れや義務感と\n\n混ざっていくとき、\n\n自分を潰す力に\n\n変わってしまうのですね。\n\n「わたしがいなければ」が\n\n愛からきているのか、\n\nそこで役に立つ自分でいることで\n\n存在意義を満たそうと\n\nしていないか。\n\n責任感の強い人は、\n\n力を抜くことを無責任だと\n\n思ってしまいますが、\n\nこれは自分を潰さないために\n\n必要な、エネルギーの\n\nさじ加減なのです。\n\n自分のエネルギーを守るからこそ、\n\n本当に必要な場面で\n\n責任を果たせるのですね。", "toi": "その責任感は、愛からきているのか。それとも、必要とされていたい気持ちからなのか。", "sources": [{"media": "Amebloブログ", "date": "2026-06-06", "title": "責任感で自分を潰さない生き方", "id": "20260606_01"}, {"media": "Amebloブログ", "date": "2025-05-01", "title": "５月１日　責任感が起こす病気", "id": "20250501_02"}, {"media": "Amebloブログ", "date": "2024-02-01", "title": "２月１日　抱え込みがちの人が最も優先すべきもの", "id": "20240201_01"}]}, "q022": {"hitokoto": "力が入るほど、結果は遠のくのです", "body": "「やってもやっても、\n\n結果が出ない」\n\nそんな焦りがつのること、\n\nありますよね。\n\nでも「成果を出そう」と\n\nすればするほど、\n\n力が入りすぎて、\n\n逆に出なくなるのです。\n\nその裏の意識には\n\n「結果を出せない自分はダメだ」\n\nという自己卑下感が\n\nふんだんにあったりします。\n\nスタート地点が恐れなので、\n\n成果が出しにくいのですね。\n\n三次元は「プロセス」の世界。\n\n今日種を植えて、明日芽が出る\n\n植物はありません。\n\n結果は、握りしめている間ほど\n\n遠くなるものだったりします。\n\n本当に成果を出したいのなら、\n\nまず自分自身が\n\n温まっている必要があるのです。\n\n今やっていることの中に、\n\n小さな面白さをひとつ\n\n見つけてみてくださいね。", "toi": "結果をいったん脇に置いたとき、今やっていることの中に残る面白さは、何なのか。そこを味わってみる。", "sources": [{"media": "Amebloブログ", "date": "2026-03-16", "title": "成果を出したいのなら成果を出そうとしてはいけない", "id": "20260316_01"}, {"media": "Amebloブログ", "date": "2026-03-30", "title": "新生活・すぐに結果を出そうとしなくていい", "id": "20260330_01"}, {"media": "Amebloブログ", "date": "2026-06-01", "title": "結果は執着しなければ必ずついてくる", "id": "20260601_01"}]}, "q023": {"hitokoto": "辞める前に、見るところがあるのです", "body": "「無理をしているのに、\n\nどうしても辞められない」\n\nそういうこと、\n\nありますよね。\n\n無理をしている時というのは、\n\n＜他者優先＞のマインドで\n\n生きてしまっている時。\n\n自分に無理を強いている\n\nというよりも、\n\n嫌われないこと、愛されることを\n\n最優先にしているから、\n\n結果的に自分が\n\n後回しになるのです。\n\nだから「辞める方法」を\n\n考えるより先に、\n\n「わたしはどうして\n\n他者を優先するのだろう」\n\nに向き合ってみてください。\n\nたいがいそこには\n\n「嫌われたくない、愛されたい」\n\nが出てくるはずです。\n\n自分で自分を愛する代わりに、\n\nその役割を他者にさせようと\n\nしていないでしょうか。\n\nそこが見えると、\n\nこれ以上無理をさせないと\n\n決められるようになるのです。", "toi": "自分で自分を愛するという役割を、誰かに肩代わりさせていないか。急がずに、静かに見てみる。", "sources": [{"media": "Amebloブログ", "date": "2024-11-13", "title": "１１月１３日 無理していることを辞めたくても辞められない時", "id": "20241113_01"}, {"media": "Amebloブログ", "date": "2025-03-13", "title": "３月１３日　人が辞めることにも意味がある", "id": "20250313_01"}, {"media": "Amebloブログ", "date": "2026-03-10", "title": "残念な退職経験で次に進めなくなっている人へ", "id": "20260310_02"}]}, "q024": {"hitokoto": "安心は、金額ではなく循環にある", "body": "「お金のことを考えると、\n\nどうしても不安になる」\n\nそんな気持ちになること、\n\nありますよね。\n\n将来が心配で、お金を\n\n遣うことができない…\n\nという声も多いのです。\n\nでも、お金があれば\n\n自動的に安心できるのかというと、\n\nそうでもなかったりします。\n\n安心できる金額は\n\n人によって全く異なりますし、\n\n遣えば減っていくからです。\n\nお金は、ただ沢山あるから\n\n安心できるのではなく、\n\n減っても入ってくる＝循環\n\nが、真の安心を生みます。\n\n入ってくる道をお給料だけに\n\n限定しないで、\n\nどんな方向からでも\n\n豊かさをウエルカムにしておく。\n\nそのほうが、お金のエネルギーは\n\n動きやすいのです。", "toi": "わたしの安心は、いくらあれば足りることになっているのか。その数字の正体を見てみる。", "sources": [{"media": "Amebloブログ", "date": "2024-11-29", "title": "みちよYouTube気づきの部屋（５６）お金さえあればという執着・経済的な安定", "id": "20241129_01"}, {"media": "Amebloブログ", "date": "2025-04-29", "title": "４月２９日　本当のお金の安心は「循環」にある", "id": "20250429_01"}, {"media": "Amebloブログ", "date": "2024-04-19", "title": "４月１９日 豊かさをウエルカムにすると起こること", "id": "20240419_02"}]}, "q025": {"hitokoto": "貯めなきゃの裏に、欠乏があるのです", "body": "「ちゃんと節約しているのに、\n\nなぜかお金が貯まらない」\n\n「貯めなきゃと思うほど、\n\n出ていく気がする」\n\nそういう経験は、\n\n誰にでもあるかもしれません。\n\n「貯めなければ」の裏には、\n\n「今、足りない」\n\n「このままでは不安だ」という\n\n＜欠乏のエネルギー＞が\n\n隠れていたりします。\n\nエネルギーは、意識を\n\n向けているものを\n\nさらに引き寄せるもの。\n\n「足りない」に意識を向けると、\n\n足りない現実がやってきます。\n\n節約とは、我慢することではなく、\n\n心が動かないものに\n\nお金を遣うのをやめること。\n\n大切なのは、貯めようとすることより\n\n「お金が循環している」という\n\n感覚を持てるかどうか。\n\n今日は、支払えたことへの\n\n小さな感謝をひとつ、\n\n見つけてみてくださいね。", "toi": "本心ではないところ、心が動かないところに遣っているお金が、ひとつあるとしたら何なのか。", "sources": [{"media": "Amebloブログ", "date": "2026-06-17", "title": "お金を貯めようとすればするほど貯まらない理由", "id": "20260617_01"}, {"media": "Amebloブログ", "date": "2025-06-17", "title": "６月１７日　節約＝心が動かないものにお金を遣うことをやめる", "id": "20250617_02"}, {"media": "Amebloブログ", "date": "2024-12-06", "title": "１２月６日 節約と意識の関係性＜お金はエネルギー＞", "id": "20241206_02"}]}, "q026": {"hitokoto": "浪費は、心が叫んでいるサインです", "body": "「つい、無駄づかいを\n\nしてしまう」\n\nそのあとで罪悪感をもつこと、\n\nありますよね。\n\nでも、お金をダダーっと\n\n遣ってしまう時は、\n\nエネルギーが足りない状態\n\nだったりします。\n\n何かが自分の中に足りないので、\n\nモノを手に入れることで\n\n満たそうとしているのですね。\n\nそれを責めたり罰したりすると、\n\n余計にエネルギーが下がって、\n\nまたどこかで遣ってしまう。\n\nだからまず、責めないこと。\n\nそのうえで「今わたしの中で、\n\nどんな部分に不足感が\n\nあるのだろう」と、\n\n優しい気持ちで心を見てください。\n\n散財の奥では、いつも\n\n何かの感情が叫んでいます。\n\nそこが見えると、\n\n自然と落ち着いていくのです。", "toi": "あのとき本当に欲しかったのは、手に入れたモノだったのか。それとも、まったく別のものだったのか。", "sources": [{"media": "Amebloブログ", "date": "2024-11-12", "title": "１１月１２日 浪費してしまう本当の理由を知ると浪費しなくなる", "id": "20241112_01"}, {"media": "Amebloブログ", "date": "2024-02-10", "title": "２月１０日　散財に隠れた心のメッセージ", "id": "20240210_01"}, {"media": "Amebloブログ", "date": "2025-02-23", "title": "２月２３日　興味あることに遣うお金は浪費ではなく必要経費", "id": "20250223_01"}]}, "q027": {"hitokoto": "喜びに遣うお金は、悪ではないのです", "body": "「自分のためにお金を使うと、\n\n罪悪感がわいてしまう」\n\n好きなものに夢中になる自分を、\n\n恥じたり罰したりすることは\n\nありますね。\n\nでも、お金を遣えるのは\n\n「生きているから」こそ。\n\nみんな自分の「好き」を\n\n味わうための\n\n＜ツール＞を欲しているだけです。\n\n水彩を描くのに、赤と青の\n\n絵の具だけあればいい、\n\nということはありませんよね。\n\nいろんな色があるから、\n\nいろんな表現ができるのです。\n\nわたしたちも同じで、\n\n喜びといういろんな色彩を\n\n味わうためにここにいます。\n\nハートが喜んでいるのなら、\n\nそれは自分に栄養を\n\n与えているということ。\n\n楽しむためのものを、\n\n悪いものにしないでくださいね。", "toi": "そのお金を遣ったとき、ハートは喜んでいたのか。感じたことのほうを、思い出してみる。", "sources": [{"media": "Amebloブログ", "date": "2026-04-08", "title": "喜びにお金を遣う時に出てくる罪悪感について", "id": "20260408_01"}, {"media": "Amebloブログ", "date": "2024-04-29", "title": "４月２９日 価値があるもの＝喜びにお金を遣う", "id": "20240429_01"}, {"media": "Amebloブログ", "date": "2025-08-27", "title": "８月２７日　賢いお金の使い方より「幸せなお金の使い方」", "id": "20250827_01"}]}, "q028": {"hitokoto": "ブロックの正体は、悲しみなのです", "body": "「お金のブロックを\n\n外したいのに、外れない」\n\nそう感じている人は\n\n多いかもしれません。\n\nお金を望んでいるはずなのに、\n\n「お金は汚いもの」\n\n「わたしにはそんな価値がない」\n\nと感じてしまう自分を、\n\n恥じることもありますね。\n\nでも、お金のブロックは\n\n本当は「お金」の問題では\n\nなかったりします。\n\nそれは「幸せを望んではいけない」\n\nという観念を植え付けられたことの\n\n＜悲しみ＞が\n\n残っているということなのです。\n\nだから豊かになっていいと\n\nアファメーションをしても、\n\nゴムバンドのように\n\n引っ張り戻されるのですね。\n\n外す前に、まず気づくこと。\n\nそこからあなた自身が、\n\n新しいメッセージを\n\n自分に伝えていけるのです。", "toi": "幸せを望んではいけない。そう教えてくれたのは、誰の声だったのか。出どころを見てみる。", "sources": [{"media": "Amebloブログ", "date": "2026-06-11", "title": "お金のブロックを外そうしても外れない理由", "id": "20260611_01"}, {"media": "Amebloブログ", "date": "2025-03-27", "title": "３月２７日　お金の勉強ではなくお金の循環の方法を学ぶ", "id": "20250327_01"}]}, "q029": {"hitokoto": "老後の不安は、今からのメッセージ", "body": "「老後のことを考えると、\n\n怖くなってしまう」\n\nそんな不安を抱えている人は、\n\n年齢に関わらず多いのです。\n\n面白いのは、そういう時ほど\n\n２〜３年後のことは飛ばして、\n\nいきなり「老後」だけに\n\nフォーカスしていること。\n\nまだ起きていない残念な姿を、\n\n創造のエネルギーを使って\n\n思い描いているのですね。\n\nこれは「思考のトリック」。\n\nそしてその奥にあるのは、\n\n「今」を楽しく生きられていない\n\nという感覚だったりします。\n\n蓄えが気になるのは、\n\n今、自分のエネルギーが\n\n足りないことの表れでもあります。\n\n今日は、フォーカスを\n\n「今」に戻してみてください。\n\n今を楽しく生きている人には、\n\nその延長の未来がやってきます。", "toi": "まだ来ていない未来を心配しているこの一日を、本当はどんなふうに過ごしたいのか。今日のぶんだけ。", "sources": [{"media": "Amebloブログ", "date": "2024-10-26", "title": "１０月２６日 若いのに老後の姿を想像して心配になる人へ", "id": "20241026_01"}, {"media": "Amebloブログ", "date": "2025-01-12", "title": "１月１２日　老後の安定は今を一生懸命に生きることから始まる", "id": "20250112_01"}]}, "q030": {"hitokoto": "あなたを幸せにするのは、あなた", "body": "「恋愛が、どうしても\n\nうまくいかない」\n\n出会えない、進まない、\n\n続かない…\n\nそのたびに、自分に何か\n\n問題があるのだろうかと\n\n思ってしまいますね。\n\n恋の苦しみの正体は、\n\n相手が自分を満たしてくれる\n\n（満たすべき）という\n\n＜他力本願＞だったりします。\n\n自分の人生を、好きな人に\n\n預けてしまうから\n\n苦しくなるのですね。\n\nそして条件を重視している時ほど、\n\n嫌われるのが怖かったりして、\n\n人を好きになる準備が\n\nできていないこともあります。\n\n大事なのは、アタマで考えた\n\n条件ではなく、一緒にいて\n\nしっくりくる雰囲気（波動）。\n\n今日は、自分のニーズを\n\nひとつ、自分で叶えてみる。", "toi": "誰かに埋めてほしいと思っているその場所を、自分で満たしてあげるとしたら、何ができるのか。", "sources": [{"media": "Amebloブログ", "date": "2024-12-15", "title": "１２月１５日 恋する苦しみを感じる時に知ってほしいこと", "id": "20241215_01"}, {"media": "Amebloブログ", "date": "2025-08-28", "title": "８月２８日　パートナーに求める理想（アタマと魂が求めるものは異なる）", "id": "20250828_01"}, {"media": "Amebloブログ", "date": "2024-11-22", "title": "みちよYouTube気づきの部屋（５５）恋愛・結婚うまくいかない悩み", "id": "20241122_01"}]}, "q031": {"hitokoto": "二人三脚は、自分の足からなのです", "body": "「パートナーと、\n\n気持ちがすれ違ってしまう」\n\nそんな時期は、\n\nどんな関係にもあるものです。\n\nパートナーシップは、\n\n＜二人三脚＞。\n\n相手にすっかり\n\n寄りかかりすぎても\n\n前に進めないですし、\n\nそれぞれが自分中心でも\n\n歩調は合いません。\n\n自分の幸せと、\n\n相手に向き合う部分。\n\nそのバランス感覚が\n\n関係を支えていたりします。\n\nそして、どんなに違いがあっても\n\n「ここだけは譲れない」部分を\n\nお互いに尊重できていれば、\n\n異なるもの同士でも\n\nうまくいくのです。\n\n自分を大切にするからこそ、\n\n相手といい関係ができる。\n\nよりよいパートナーとの関係は、\n\n自分自身との関係性の\n\n延長線上にあるのです。", "toi": "わたしの「ここだけは譲れない」という部分を、相手に正直な言葉で伝えたことが、あっただろうか。", "sources": [{"media": "Amebloブログ", "date": "2025-11-22", "title": "１１月２２日　よりよいパートナーシップを築くには", "id": "20251122_01"}, {"media": "Amebloブログ", "date": "2025-04-30", "title": "４月３０日　パートナーとうまく行くのは「絶対譲れない部分」の尊重", "id": "20250430_01"}, {"media": "Amebloブログ", "date": "2025-08-28", "title": "８月２８日　パートナーに求める理想（アタマと魂が求めるものは異なる）", "id": "20250828_01"}]}, "q032": {"hitokoto": "怒りは、悲しみの表現なのです", "body": "「夫への怒りが、\n\nどうしても止まらない」\n\nそう感じている人は、\n\n本当に多いのです。\n\n怒りは悪いものだと思って、\n\n飲み込んでしまう人も\n\n多いと思います。\n\nでも、顕在意識で\n\n抑えたつもりでいても、\n\n感情のレベルでは\n\nマグマに蓋をした火山のように\n\nずっと渦巻いているのです。\n\nそして「もう昔のことだし」と\n\n飲み込んでなかったことにするほど、\n\n忘れたころにぶり返します。\n\n＜怒りは悲しみの表現＞。\n\n相手を責めたくなるのは、\n\nこの苦しみをわかってほしい時\n\nだったりします。\n\nノートに書く、独り言で吐き出す、\n\nカラオケで声にする。\n\n出していくと、その下にあった\n\n本音に出会えますよ＾＾", "toi": "その怒りの下にある悲しみを、本当はどんな言葉で、誰にわかってほしかったのか。書き出してみる。", "sources": [{"media": "Amebloブログ", "date": "2024-05-10", "title": "みちよYouTube「気づきの部屋」（３4）夫に対する怒りが止まらない！", "id": "20240510_01"}, {"media": "Amebloブログ", "date": "2026-01-27", "title": "昔の怒りが何度もぶり返す時", "id": "20260127_01"}, {"media": "Amebloブログ", "date": "2025-12-15", "title": "１２月１５日　怒りのエネルギーを有効活用する", "id": "20251215_01"}]}, "q033": {"hitokoto": "執着ではなく、ハートを見るのです", "body": "「あの人のことが、\n\nどうしても頭から離れない」\n\nそんな自分を、やめたいと\n\n思うこともありますね。\n\nでも執着するのは、\n\n「それがないと困る」という\n\n不安があるからなのです。\n\nだから執着だけを\n\nやめようとしても、\n\nその奥の不安が\n\n軽くならない限り、\n\nやめられないのですね。\n\n握りしめた手には、\n\n新しいものを乗せてもらえません。\n\n手放すというのは諦めではなく、\n\n手を開いて、受け取れる状態に\n\nすることだったりします。\n\n執着自体をどうにかしようと\n\nしないで、\n\n＜弱っているハート＞を\n\n見てあげてください。\n\n「何が不安で執着しているのかな」と、\n\n優しく自問してみてください。\n\nそこに光が差すと、\n\n執着は自然に薄らいでいきますよ。", "toi": "その人がいないと困ると感じているのは、いったい何を失うのが怖いからなのか。ハートに聞いてみる。", "sources": [{"media": "Amebloブログ", "date": "2026-01-03", "title": "執着の奥にある不安を見つめると執着は薄らぐ", "id": "20260103_01"}, {"media": "Amebloブログ", "date": "2024-04-15", "title": "４月１５日 執着を外そうとすればするほど外れない理由", "id": "20240415_01"}, {"media": "Amebloブログ", "date": "2026-04-30", "title": "苦しい執着を手放すことが怖いと思う人へ", "id": "20260430_01"}]}, "q034": {"hitokoto": "一緒にいるほうが、孤独なこともある", "body": "「別れるかどうか、\n\nどうしても決められない」\n\nその迷いの奥に、\n\n「ひとりになる怖さ」が\n\nあることは多いのです。\n\n孤独を避けるために、\n\n今の不満な関係を\n\n続けることを選ぶ人もいます。\n\nでも、心が通い合っていない人と\n\n一緒にいることのほうが、\n\nもっと孤独だということも\n\nあるのですね。\n\nひとりになることは、\n\nエネルギーをリセットします。\n\nしばらく引きずるけれど、\n\n落ち着いた時には\n\n自分の力を取り戻していきます。\n\nそして別れは終わりではなく、\n\nひとつの通過点。\n\n続いたか続かなかったかよりも、\n\nもっと大切なものを\n\nその関係から得ているのです。\n\nその経験が、また違った\n\nバージョンのあなたを\n\n生んでいたりします。", "toi": "この関係の中で、わたしの心はちゃんと通い合えているのか。その答えは、急がなくていいのです。", "sources": [{"media": "Amebloブログ", "date": "2024-03-16", "title": "３月１６日　孤独を恐れずに別れを選択したら起こること", "id": "20240316_02"}, {"media": "Amebloブログ", "date": "2024-11-28", "title": "１１月２８日 出会いにも別れにも意味がある", "id": "20241128_02"}, {"media": "Amebloブログ", "date": "2024-08-08", "title": "８月８日 一方通行を感じたら離れるタイミング", "id": "20240808_01"}]}, "q035": {"hitokoto": "仲良くできない親子でも、いいのです", "body": "「母と会うたびに、\n\nどうしても苦しくなる」\n\nそんな重さを抱えている人は、\n\n少なくないのです。\n\n親子であっても、\n\n血のつながりがあったとしても、\n\nエネルギーの上では＜別もの＞。\n\n「親子だから」\n\n「親子なのに」\n\nその言葉があるほど\n\n理想を求めすぎて、\n\n関係はかえって重くなったりします。\n\n＜仲良くできない親子＞でも、\n\nいいのです。\n\n仲良くできないことを\n\nダメだとか恥だと思わず、\n\n”一人の人間”として\n\n見てみてくださいね。\n\n母の言葉がまだ響くのなら、\n\nその言葉を発した人が\n\n幸せだったのかどうか、\n\n思い返してみるのもいいかもしれません。\n\n苦しいと言えたあなたは、\n\nもう動きはじめています＾＾", "toi": "本当は母とどうありたいのか。その答えは、もうあなたの中に静かに置かれているのかもしれません。", "sources": [{"media": "Amebloブログ", "date": "2026-02-13", "title": "仲良くできない親子でもいい", "id": "20260213_02"}, {"media": "Amebloブログ", "date": "2026-02-15", "title": "親からのネガティブな言葉の呪いを反面教師にする", "id": "20260215_01"}, {"media": "Amebloブログ", "date": "2025-02-28", "title": "みちよYouTube気づきの部屋（６３）わたしの苦しみは「母」", "id": "20250228_01"}]}, "q036": {"hitokoto": "「親」より先に「自分」を悲しませない", "body": "「親の前では、いまだに\n\n素の自分が出せない」\n\nそう感じること、ありますよね。\n\nこれは、子供の頃から\n\n親のために「理想の子供」を\n\nやってきてあげた証拠なのです。\n\n大人になった今も、\n\nまだ＜親対策＞をしている感じ。\n\nその奥には\n\n「親を悲しませてはいけない」\n\nという親思いの気持ちがあります。\n\nでも、そうやって\n\n「親」を悲しませないようにして、\n\n「自分」を悲しませていたりします。\n\n家族仲がよかったとしても、\n\n《本当の自分》と《外側の自分》が\n\n離れていれば、葛藤は生まれるのです。\n\n今日は、他者の感情と\n\n自分の感情を、そっと切り分けてみる。\n\n相手を気にしすぎて\n\n自分をおろそかにするのは、\n\n本当の優しさではないのですよ", "toi": "親の望む姿でいた時間と、素のままでいられた時間。どちらを長く生きてきたのか、静かに数えてみる。", "sources": [{"media": "Amebloブログ", "date": "2026-03-09", "title": "大人になっても親のために子役を演じている人へ", "id": "20260309_01"}, {"media": "Amebloブログ", "date": "2025-02-03", "title": "２月３日　家族仲が良くても心の葛藤があれば人生が生きづらくなる", "id": "20250203_01"}, {"media": "Amebloブログ", "date": "2025-01-04", "title": "１月４日　子の気持ち親知らず", "id": "20250104_01"}]}, "q037": {"hitokoto": "その心配は、愛ではなく恐れかもしれません", "body": "「子どものことが、\n\n心配でたまらない」\n\n親なら、当たり前の気持ちですね。\n\nそこは、そのままでいいのです。\n\nでも、あまりにも過剰な心配は、\n\n親御さん自身の\n\n「子供時代の感情」が\n\nそうさせているかもしれません。\n\n我慢したり、寂しい思いをした人ほど\n\n「同じ思いをさせたくない」となって、\n\n気が気ではなくなるのです。\n\nそれは「心配＝愛」に見えて、\n\n実は「自分と同じになったら\n\nどうしよう」という＜恐れ＞。\n\n子どもを見ているようで、\n\n昔の自分が今も泣いていたりします。\n\nお子さんの問題ではなく、\n\n自分の中の「小さい子」から\n\nきていることもあるのです。\n\n本当の愛情は「見守る」こと。\n\n今日は子どものことより先に、\n\nあなたが喜べることを\n\nひとつだけしてみてくださいね", "toi": "心配しているのは今の子どもなのか、それとも昔のわたし自身なのか。少しだけ見つめてみる。", "sources": [{"media": "Amebloブログ", "date": "2025-04-22", "title": "４月２２日　子どもを過剰に心配しすぎる時の意味", "id": "20250422_02"}, {"media": "Amebloブログ", "date": "2025-05-30", "title": "５月３０日　本当の愛情は「見守る」こと", "id": "20250530_02"}, {"media": "Amebloブログ", "date": "2024-01-12", "title": "１月１２日　親が子供の将来を応援できる最幸の方法", "id": "20240112_02"}]}, "q038": {"hitokoto": "あの子は、自分を尊重しているのです", "body": "「子どもが学校に\n\n行かなくなってしまった」\n\nどうしていいかわからない。\n\nその戸惑い、そうですよね。\n\nエネルギーで視ると、\n\n不登校のお子さんを持つ親御さんは\n\n子どもの頃から「真面目」だった、\n\nということが多いのです。\n\n親を困らせないよう、\n\n細心の注意を払って\n\n「子供」の役割を務めてきた。\n\nでもその子たちは、\n\n親を困らせているのではなく\n\n「自分の思いを尊重、優先」\n\nしているだけだったりします。\n\n「みんなと同じでないと恥ずかしい」\n\nその観念は、あなた自身が\n\n子どもの頃に浴びてきた\n\n「世間体」かもしれません。\n\n今日はお子さんではなく、\n\nあなたの心の中にいる\n\n「助けを求める自分」に\n\n気づいてあげてくださいね", "toi": "あの子のことで苦しいのは、周りの目なのか、それとも昔のわたしがしてきた我慢なのか。", "sources": [{"media": "Amebloブログ", "date": "2024-11-15", "title": "１１月１５日 不登校の子供を持つ親御さんに気づいてほしいこと", "id": "20241115_01"}, {"media": "Amebloブログ", "date": "2026-03-01", "title": "親の観念を破壊する子供が生まれる意味", "id": "20260301_01"}, {"media": "Amebloブログ", "date": "2024-03-22", "title": "みちよYouTube「気づきの部屋」（２８）不登校・引きこもり家族の悩み", "id": "20240322_01"}]}, "q039": {"hitokoto": "一番大切にする家族は、あなた自身", "body": "「家族なのに、\n\nどうしてわかってくれないのか」\n\nそう感じること、ありますよね。\n\n「家族だから」わかるだろう。\n\n「家族なのに」なぜわからないんだ。\n\nその「だから」と「なのに」が、\n\nあなたを苦しめていたりします。\n\n肉親でも、それぞれの\n\n「エネルギー」が違うので、\n\nどんなに近しい存在でも\n\nあなたと同じではないのです。\n\nイライラやムカムカは、\n\n「わかってほしかったけど、\n\nわかってくれないからなんだな」\n\nと、いったんわかってあげる。\n\n「家族だから」我慢しなきゃ、\n\n許さなきゃ、は要らないのです。\n\nあなたが一番大切にしなければ\n\nいけない家族は「あなた自身」。\n\nどうしても苦しいのなら、\n\n距離を置いてもいいのですよ", "toi": "家族に本当はどう扱われたかったのか。その願いを、まずは自分から自分へ贈ってみる。", "sources": [{"media": "Amebloブログ", "date": "2025-12-26", "title": "１２月２６日　「家族だから」や「家族なのに」があるから苦しい", "id": "20251226_01"}, {"media": "Amebloブログ", "date": "2024-08-17", "title": "８月１７日 帰省にモヤモヤするのなら考えてほしいこと", "id": "20240817_01"}, {"media": "Amebloブログ", "date": "2025-02-03", "title": "２月３日　家族仲が良くても心の葛藤があれば人生が生きづらくなる", "id": "20250203_01"}]}, "q040": {"hitokoto": "「察しろ」を手放すと、荷物は軽くなる", "body": "「いつも、わたしばっかり」\n\nそう思いながら、\n\n今日も動いているのですよね。\n\n「言わせるな、察しろ」\n\nそう思っている人ほど、\n\nエンドレスで抱えることになります。\n\nそして心が折れたり、\n\n身体を壊したりして、\n\nそんな自分を一番嫌っていたりする。\n\nそれでは自分が可哀そうです。\n\n家事は誰かがやるものですが、\n\n家族がいるのなら\n\n「あなた一人」の仕事ではないのです。\n\nガマンを続けるよりも、\n\n「自分を助ける方法」を\n\n身につけていくほうがいいのです。\n\n今日は、名もない小さな家事に\n\nひとつ名前をつけて書き出してみる。\n\nうやむやにせずに話してみることも、\n\n自分を救う道だったりしますよ", "toi": "「察してほしい」の下にある、本当に言いたかった一言。それは、どんな言葉だったのか。", "sources": [{"media": "Amebloブログ", "date": "2025-03-26", "title": "３月２６日　家事の不公平感に我慢しない", "id": "20250326_01"}, {"media": "Amebloブログ", "date": "2025-10-29", "title": "１０月２９日　「名もなき労働」を可視化すると疲れなくなる", "id": "20251029_02"}, {"media": "Amebloブログ", "date": "2026-04-02", "title": "「いつもわたしばっかり！」の人に試してほしい「目には目を歯には歯を」", "id": "20260402_01"}]}, "q041": {"hitokoto": "イライラの下には、悲しみがいます", "body": "「イライラが、止まらない」\n\n止めようにも止まらない。\n\nそういう時、ありますよね。\n\nそもそも「イライラ」とは、\n\n「怒り」を止めている状態。\n\nだから怒りを止めない限り、\n\nイライラを止めるのは難しいのです。\n\nそして怒りの下には、\n\nたいてい「悲しみ」がいます。\n\nイライラする自分をダメだ、\n\n嫌いだと思うのではなく、\n\n「わたしはこんな悲しみを\n\n感じていたから、\n\nイライラしていたんだ」\n\nそうわかると気持ちがすーっとなって、\n\nイライラはだんだんおさまっていきます。\n\n今日は、その思いを\n\nノートに書いて出してみる。\n\n飲み込んだ感情は、\n\n思考では一瞬消えても、\n\n感情ではずっと残るのです", "toi": "そのイライラの下で、本当は何が悲しかったのか。まだ言葉にしないまま、置いてきたもの。", "sources": [{"media": "Amebloブログ", "date": "2024-03-21", "title": "３月２１日　イライラの下にある大事な感情に気づく", "id": "20240321_01"}, {"media": "Amebloブログ", "date": "2025-12-15", "title": "１２月１５日　怒りのエネルギーを有効活用する", "id": "20251215_01"}, {"media": "Amebloブログ", "date": "2026-01-27", "title": "昔の怒りが何度もぶり返す時", "id": "20260127_01"}]}, "q042": {"hitokoto": "モヤモヤは、ハートからのサインです", "body": "「なんとなくモヤモヤするけれど、\n\n理由がわからない」\n\nうまく言葉にできない自分を\n\n責めてしまうこともありますよね。\n\nでも悩みというのは、\n\n言葉になる前の段階から\n\nちゃんと存在しているものなのです。\n\nモヤモヤは\n\n「エネルギーが合ってないよ」\n\nというハートからのサイン。\n\nたいがい、そこを思考が否定します。\n\n「今やめたら損をする」\n\n「今縁を切ったら勿体ない」\n\nそんな”損得”でスルーすると、\n\n違和感は消えるどころか、\n\n時間が経つほど増していきます。\n\n今日は、考えない時間をつくる。\n\nただ紙に気持ちを書き出してみる。\n\n霧が晴れるように、\n\nじわっと見えてくるかもしれません", "toi": "そのモヤモヤは、何に対して「違う」と言っているのか。答えを急がずに、置いておく。", "sources": [{"media": "Amebloブログ", "date": "2025-12-07", "title": "１２月７日　違和感をスルーしない", "id": "20251207_01"}, {"media": "Amebloブログ", "date": "2026-05-20", "title": "何に対して悩んでいるかわからない時", "id": "20260520_01"}, {"media": "Amebloブログ", "date": "2024-07-17", "title": "７月１７日 モヤモヤは成仏すべき感情を溜めたサイン", "id": "20240717_01"}]}, "q043": {"hitokoto": "落ち込む時もあるよね、と寄り添う", "body": "「落ち込んだ気持ちから、\n\n抜け出せない」\n\n早く元気になりたいですよね。\n\nでも人間はいつも一定ではなく、\n\n気分のいい時も悪い時もあります。\n\nでも無理に気分を上げようとすると、\n\nかえって苦しくなったりします。\n\n落ち込む時というのは、\n\n自分を罰していたり、\n\n責めている時なのです。\n\n自分を責める意識が”ナイフ”になって\n\n自分のエネルギーを傷つけるので、\n\n心が元気をなくしていきます。\n\nだから、何か特別なことをせず、\n\n「うん、落ち込んだり、\n\n元気がない時もあるよね」\n\nと、そんな自分に\n\n静かに寄り添ってあげてください。\n\n気分が上がるのは、\n\nそうやって自分に優しくあるからこそ。\n\n自分を攻撃しないことは、\n\n心のエコなのですよ", "toi": "落ち込む少し前に、自分自身へ向けて何を言ったのか。そのひとことを、静かに思い出してみる。", "sources": [{"media": "Amebloブログ", "date": "2025-08-04", "title": "８月４日　落ち込んだり元気がない時の対処法", "id": "20250804_01"}, {"media": "Amebloブログ", "date": "2024-11-20", "title": "１１月２０日 心が沈む時には必ず原因がある", "id": "20241120_01"}, {"media": "Amebloブログ", "date": "2024-03-17", "title": "３月１７日　元気がない時に元気になれる最短コース", "id": "20240317_01"}]}, "q044": {"hitokoto": "許せない時は、許さなくていいのです", "body": "「どうしても、\n\n許せない人がいる」\n\nわかってもらえなかった。\n\n受け止めてもらえなかった。\n\nその理由のどれにも、\n\n「悲しかった」という感情が\n\n込められているのですね。\n\n人は悲しい思いをすると、怒ります。\n\n怒りを通り越して「許せない」になる。\n\nだから、許せない時は\n\n許さなくていいのです。\n\n「許せない」と感じる自分を罰せず、\n\n「それだけ悲しい思いをした」と\n\n理解してあげてください。\n\n「許せないわたしを、わたしが許す」\n\nそう受け入れると、\n\n怒りは消えていなくても、\n\nだんだん「もはやどうでもいい」\n\nへと変わっていったりします。\n\n今日は許すことよりも、\n\n「今」の自分を大切に過ごしてみる", "toi": "許せないその出来事で、いちばん悲しかったのはどこだったのか。そこにだけ、そっと触れてみる。", "sources": [{"media": "Amebloブログ", "date": "2024-10-05", "title": "１０月５日 許せない自分を自分で許すとすべてを許せるようになる", "id": "20241005_01"}, {"media": "Amebloブログ", "date": "2024-09-05", "title": "９月５日 許せない時は許さなくていい", "id": "20240905_01"}, {"media": "Amebloブログ", "date": "2024-01-09", "title": "１月９日　「許せないこと」に対する意識を変える方法", "id": "20240109_01"}]}, "q045": {"hitokoto": "本当のネガティブは、それを嫌う意識", "body": "「ネガティブに考えてしまう\n\n自分が、いやになる」\n\n手放したいのに手放せない。\n\nその苦しさ、ありますよね。\n\nでも、ネガティブ思考を\n\nダメだと思って手放そうとするほど\n\nうまくいかず、\n\n手放せない自分をさらに嫌になり、\n\nまたネガティブになっていくのです。\n\n本当のネガティブは、\n\n「ネガティブを嫌う意識」のほう。\n\n感情がクレヨンだとしたら、\n\n明るい色だけでは成り立ちません。\n\n暗い色も、ちゃんと必要なのです。\n\nむしろネガティブさは、\n\n創造性の塊だったりします。\n\n今日はネガティブな自分を\n\n追い出そうとせずに、\n\n「そういう時もある」と\n\nそのまま置いておいてみる。\n\n受け入れた時、\n\n苦しさは静かに薄れていきますよ", "toi": "ネガティブな自分を嫌ってきた長い時間。その意識は、いったい何を守ろうとしてきたのか。", "sources": [{"media": "Amebloブログ", "date": "2026-02-23", "title": "ネガティブ思考を手放したいのならネガティブ思考を嫌ってはいけない", "id": "20260223_01"}, {"media": "Amebloブログ", "date": "2025-02-26", "title": "２月２６日　ネガティブを嫌わなくていい理由はたくさんある", "id": "20250226_01"}, {"media": "Amebloブログ", "date": "2024-11-17", "title": "１１月１７日 ネガティブな現象を引き寄せる意識", "id": "20241117_01"}]}, "q046": {"hitokoto": "心配な時こそ、少しだけ緩めてみる", "body": "「この先のことを考えると、\n\n不安でたまらない」\n\n前に進めない、身体が緊張する。\n\nそういう時、ありますよね。\n\n不安がある時ほど、\n\n考えることでどうにかしようとしますが、\n\n考えても心配が減るわけではないのです。\n\n考えてばかりでいると、\n\nかえってエネルギーが重くなります。\n\nだから、心配事がある時こそ\n\n少しだけ「緩める」。\n\nホッとすることを優先したり、\n\n笑顔になることを取り入れたり、\n\n身体をリラックスさせてみる。\n\nその「緩み」から、\n\nエネルギーは変わっていきます。\n\n外の情報に揺れてしまう時も、\n\n自分に軸が戻ってくると、\n\n＜自分の感覚＞を\n\n信じられるようになっていきますよ", "toi": "今この瞬間に、本当に困っていることはいくつあるのか。ひとつずつ、指を折って数えてみる。", "sources": [{"media": "Amebloブログ", "date": "2024-06-20", "title": "６月２０日 問題や心配事がある時こそ「緩める」", "id": "20240620_01"}, {"media": "Amebloブログ", "date": "2025-08-08", "title": "８月８日　怖い情報で不安になってしまう人へ", "id": "20250808_01"}, {"media": "Amebloブログ", "date": "2024-11-01", "title": "みちよYouTube「気づきの部屋」（５９）不安と恐れ", "id": "20241101_01"}]}, "q047": {"hitokoto": "決められない時には、理由があります", "body": "「どうしても、決められない」\n\n期限があるから、\n\n相手をがっかりさせたくないから、\n\nと自分に無理をさせることも\n\nあるかもしれません。\n\nでも決断できないことは基本、\n\n「”今”決断しないほうがいい」ものか、\n\n「決断しないほうがいい」のか、\n\nどちらかなのです。\n\nいずれにしても、\n\n心がそれにYESと言わない\n\n何かしらの「理由」があります。\n\n無理に出した答えは、\n\n往々にして後悔することになります。\n\n迷っている時は、\n\n答えが「わからない」のではなく、\n\n答えが「見えなく」なっているだけ。\n\n今日は迷いをいったん脇に置いて、\n\n「今ここ」に意識を戻して、\n\nしっかり呼吸してみてください。\n\n霧が晴れると、答えは最初から\n\nそこにあったと気づけたりします", "toi": "決めきれずにいるその選択のどこで、心は小さく「いいえ」と言っているのか。急がずに聞いてみる。", "sources": [{"media": "Amebloブログ", "date": "2024-11-07", "title": "１１月７日 決断できない時には必ず理由がある", "id": "20241107_02"}, {"media": "Amebloブログ", "date": "2024-05-04", "title": "５月４日 迷った時こそすべき最善の方法", "id": "20240504_01"}, {"media": "Amebloブログ", "date": "2026-04-21", "title": "選んだ道が正しいか正しくないかはどうやってわかる", "id": "20260421_01"}]}, "q048": {"hitokoto": "正解とは、自分自身でいること", "body": "「どれが正解なのか、\n\n知りたくてたまらない」\n\n間違いたくない。\n\nその気持ち、よくわかります。\n\nでも、ここで言う「正解」とは、\n\n世間体的・社会的な、いわゆる\n\n「他者軸」の”正解”のこと。\n\nあなた自身の正解ではないのです。\n\n他者に合わせている時間が長いほど\n\n正解が欲しくなって、\n\n「これが正解」という情報に\n\n翻弄されてしまいます。\n\nそしてそこには、もれなく\n\n「正解」などなかったりします。\n\n正解を求めるかわりに、\n\n「今日はわたしにどんな経験を\n\n与えたら楽しいかな」と考えて、\n\n自分のために動いてみる。\n\nあなたが「ありのまま」でいること。\n\n＜自分自身でいること＞が、\n\n正解なのですよ", "toi": "その正解は、誰にとっての正解だったのか。世間のものなのか、わたし自身のものなのか。", "sources": [{"media": "Amebloブログ", "date": "2026-04-20", "title": "正解だけを求めると正解がわからなくなる", "id": "20260420_02"}, {"media": "Amebloブログ", "date": "2025-10-10", "title": "１０月１０日　正解を求めすぎると人生が停止する", "id": "20251010_02"}, {"media": "Amebloブログ", "date": "2024-11-18", "title": "１１月１８日 正しい学び方は自分の心が知っている", "id": "20241118_01"}]}, "q049": {"hitokoto": "「今ここ」に戻ると、変化が始まる", "body": "「変わりたいのに、変われない」\n\nもどかしいですよね。\n\n実は「変わりたい」と思う時ほど、\n\nなかなか変わらないものなのです。\n\n「変わりたい」と思っている時は、\n\n今の現状を見たくなかったり、\n\n「今ここ」を放棄している感じ。\n\nだから一旦それを脇に置いて、\n\n目の前の日常を味わってみてください。\n\n食べたいものを食べに行く。\n\n会いたい人に会いに行く。\n\n読みたかった本を読む。\n\nそんなベタな日常を味わうと、\n\n軸が自分に戻ってきて、\n\nエネルギーが動き出します。\n\nそして本当は、\n\n何か別者に「変わる」のではなく、\n\n「本当の素の自分に戻る」こと。\n\n今の自分を大切にしていると、\n\n物事は自然に変わっていくのです", "toi": "変わりたいと言う時、いちばん見たくないのは今のどこなのか。そっと目を向けてみる。", "sources": [{"media": "Amebloブログ", "date": "2025-04-14", "title": "４月１４日　変わりたい人がやるべきこと（変わりたい時こそ変われない）", "id": "20250414_01"}, {"media": "Amebloブログ", "date": "2024-07-08", "title": "７月８日 変わりたいのに変われない理由", "id": "20240708_01"}, {"media": "Amebloブログ", "date": "2025-06-15", "title": "６月１５日　「変わりたい」と思う時こそ知ってほしいこと", "id": "20250615_01"}]}, "q050": {"hitokoto": "完璧主義は、究極の理想主義なのです", "body": "「完璧にできないと、気がすまない」\n\nそう感じること、ありますよね。\n\n完璧主義とは言い換えると、\n\n「頭の中にたくさんのルールが\n\nある状態」なのです。\n\n「こうあるべき」\n\n「こうでなければおかしい」\n\nでも現実はその通りにならないので、\n\nいつも何かや誰かに、\n\nなにより自分自身に、\n\n怒りを抱えていたりします。\n\nその裏にいるのは\n\n「失敗したくない」\n\n「馬鹿にされたくない」\n\nという＜怖れ＞。\n\nエネルギーは、流れている時に育ちます。\n\n完璧を狙っていると、\n\n川の水がよどむように止まってしまう。\n\n今日は「今の自分でもできること」を\n\nひとつだけ始めてみてください。\n\n人はいろんなエラーをするし、\n\n完璧にはならない存在なのですよ", "toi": "頭の中のそのルールは、いつ、誰から受け取ったものだったのか。ひとつ思い出してみる。", "sources": [{"media": "Amebloブログ", "date": "2024-02-28", "title": "２月２８日　完璧主義は究極の理想主義", "id": "20240228_01"}, {"media": "Amebloブログ", "date": "2026-04-28", "title": "「完璧じゃないと」はエネルギーを止める", "id": "20260428_01"}, {"media": "Amebloブログ", "date": "2024-11-06", "title": "１１月６日 完璧ではないことを受け入れると人間としてできることが増える", "id": "20241106_01"}]}, "q051": {"hitokoto": "失敗を「失敗」とするのが、本当の失敗", "body": "「失敗するのが、怖くて動けない」\n\n新しいことを始めたいのに、\n\n一歩が出ない。そうですよね。\n\nでも実は、失敗の体験が\n\n心を傷つけているのではなく、\n\nそれ以前から「自分を傷つける意識」\n\nがあって、うまくいかないことを\n\n自分のせいにするので傷つくのです。\n\n怖いのは失敗そのものではなく、\n\n何でも自分のせいにする\n\nその意識のほうだったりします。\n\n失敗を＜個人の失態・落ち度＞に\n\nしてしまうのは、勿体ない。\n\n失敗は経験値を上げてくれる\n\n＜貴重な機会＞なのです。\n\nすべてを「経験」として、\n\n”成功”や”失敗”と色を付けずにいると、\n\nその全部が土台になっていきます。\n\n今日は結果を出すためではなく、\n\n「楽しい経験を味わう」ために、\n\n小さくひとつ動いてみる＾＾", "toi": "これまで「失敗」と呼んできたこと。それは本当に失敗だったのか、それとも経験だったのか。", "sources": [{"media": "Amebloブログ", "date": "2024-09-26", "title": "９月２６日 失敗を「失敗」とするのは本当の失敗", "id": "20240926_01"}, {"media": "Amebloブログ", "date": "2025-01-03", "title": "１月３日　失敗すると心が傷ついて立ち直れないと思っている人へ", "id": "20250103_01"}, {"media": "Amebloブログ", "date": "2026-02-16", "title": "失敗を失敗としなければ成功する", "id": "20260216_01"}]}, "q052": {"hitokoto": "人間は、機械ではなく生き物なのです", "body": "「ちゃんと休んだはずなのに、\n\n疲れが抜けていかない」\n\nそう感じる日が\n\n続くことがありますよね。\n\nわたしたち人間は\n\n「有機的」なエネルギーを持つ\n\n生き物なのに、\n\n「無機質」なものばかりに\n\n囲まれていると、\n\n電磁的な閉塞感からくる疲れが\n\n起こったりします。\n\n休んだつもりでも、\n\nずっと画面の中にいたのなら、\n\nエネルギーのほうは\n\n働きっぱなしなのですね。\n\n今日は少しだけ\n\n「生き物」に触れてみてください。\n\n近所の公園に寄り道する、\n\nベランダの植物に水をやる。\n\n手や足が土に触れると、\n\n生物エネルギーが\n\n自然に動き出します。\n\n自分を可愛がって癒すことに、\n\n罪悪感はいらないのです＾＾", "toi": "その疲れは、休み方の問題なのか。それとも、休むことを自分に許していないからなのか。", "sources": [{"media": "Amebloブログ", "date": "2025-09-06", "title": "９月６日　デジタルに疲れない生き方（人間は生き物であることを思い出す）", "id": "20250906_01"}, {"media": "Amebloブログ", "date": "2024-07-09", "title": "７月９日 普段から頑張っている自分を可愛がって癒す", "id": "20240709_01"}, {"media": "Amebloブログ", "date": "2026-06-15", "title": "身体が思うように動かない時の考え方", "id": "20260615_01"}]}, "q053": {"hitokoto": "眠りをつくるのは、昼間の心なのです", "body": "「体は疲れているのに、\n\n夜になると眠れない」\n\nそんな夜が続くのは、\n\n本当に苦しいですよね。\n\n眠りのコンディションを保つのは、\n\n寝具や寝室よりも\n\n「心」だったりします。\n\n悩み事、心配、怒り、悲しみが\n\nあるとき、\n\n感情が思考を刺激して、\n\n意識が休まらなくなるのです。\n\n「気が立っている」というのは、\n\n気＝エネルギーが回転し続けて、\n\nゆるめられない状態のこと。\n\nだから無理に眠ろうとするより、\n\n日中の心を楽にしておくほうが、\n\n近道だったりします。\n\n今夜は、今日一日の中の\n\n楽しかったこと、\n\n感謝できることを\n\nひとつだけ思い出しながら、\n\nお布団に入ってみてください。\n\n眠りにつく前の時間は、\n\n翌日の波動を決める時間でもあるのです。", "toi": "眠れない夜、頭の中でずっと繰り返しているのは、誰に向けた、どんな言葉なのか。静かに眺めてみる。", "sources": [{"media": "Amebloブログ", "date": "2026-02-21", "title": "良い睡眠は昼間の心の状態で作られる", "id": "20260221_01"}, {"media": "Amebloブログ", "date": "2024-01-24", "title": "１月２４日　不眠とエネルギーの関係", "id": "20240124_01"}, {"media": "Amebloブログ", "date": "2025-08-15", "title": "８月１５日　眠りにつく前の時間が翌日の波動を決める", "id": "20250815_01"}]}, "q054": {"hitokoto": "身体は、心の声を代わりに話しています", "body": "「病院に通っているのに、\n\nなかなか良くならない」\n\nその辛さは、\n\n本当に大きいと思います。\n\nまず、専門家にみてもらうことも、\n\n自分を大切にすることのひとつ。\n\nそのうえで、\n\nエネルギーからの見方をひとつ。\n\nなかなか改善しない症状には、\n\n「心の訴え」が\n\n乗っていることがあります。\n\nわかってほしい。\n\n気遣ってほしい。\n\nこんなに頑張っているんだよ。\n\n病気は、感情が心から出ないで\n\n＜身体＞から表現されたもの。\n\n厳しい意識があると、\n\n自分を認めることも、\n\n休めることもしません。\n\nだから身体のほうが、\n\n自分に向けてアピールするのですね。\n\n今日は身体に\n\n「いつもありがとう」と\n\n伝えてみてください。", "toi": "その不調が、あなたに代わって訴えてくれているのは、どんな気持ちなのか。少しだけ、聞いてみる。", "sources": [{"media": "Amebloブログ", "date": "2025-11-15", "title": "１１月１５日　なかなか治らない病気の意味", "id": "20251115_01"}, {"media": "Amebloブログ", "date": "2024-11-21", "title": "１１月２１日 「なかなか改善しない症状」が訴えていること", "id": "20241121_01"}, {"media": "Amebloブログ", "date": "2026-06-15", "title": "身体が思うように動かない時の考え方", "id": "20260615_01"}]}, "q055": {"hitokoto": "時間がないの奥に、怖いが隠れています", "body": "「やりたいことがあるのに、\n\n時間がなくてできない」\n\nそういうこと、ありますよね。\n\nさっさと用事を済ませようとしても、\n\n後から後から仕事が増えて、\n\n一日が「義務・責任」で\n\n終わってしまう。\n\nそんな時は、無意識に\n\n「やりたいことをやる自分」へ\n\nブレーキをかけている\n\nことがあったりします。\n\nうまくいかなかったらどうしよう。\n\n思ったような結果が出ないかも。\n\nやりたい、と、怖い。\n\n真反対の感覚が、\n\n同時に起こるのですね。\n\n今日は「やること＝先」の\n\nパターンを少しだけ崩して、\n\n好きなことをひとつだけ\n\n先にやってみてください。\n\n結果ではなく、\n\n人生を楽しんでいいのです。", "toi": "時間がないと言っている時、本当は何を先延ばしにしていたいのか。その奥の怖さを見てみる。", "sources": [{"media": "Amebloブログ", "date": "2025-08-13", "title": "８月１３日　「やりたいのに時間がなくてできない」時の本当の理由", "id": "20250813_01"}, {"media": "Amebloブログ", "date": "2025-08-05", "title": "８月５日　「忙しい」を理由にしたくなる時", "id": "20250805_01"}, {"media": "Amebloブログ", "date": "2025-12-02", "title": "１２月２日　忙しい中でも＜心の余裕＞を持つとなぜかうまくいく", "id": "20251202_01"}]}, "q056": {"hitokoto": "続ける目的を、楽しむためにする", "body": "「何を始めても、\n\n三日坊主で終わってしまう」\n\nそうやって自分を責めてしまうこと、\n\nあるかもしれません。\n\nでも続かないのは、\n\n飽きっぽい性格のせいではないのです。\n\n「続けなきゃ」でやっている時は、\n\nまだ気持ちが乗っていないということ。\n\nそして多くの場合、\n\nすぐにできるようになろうとして、\n\nそのもの自体を\n\n楽しんでいなかったりします。\n\nやり始めた時のワクワクが\n\n「できる自分になった時」の\n\n想像だったのなら、\n\n上達が見えないとたんに、\n\nやる気はしぼんでしまうのですね。\n\n続けられる時に、方法はいりません。\n\nただ好きなことを\n\nやっているだけなのです。\n\n今日は「続ける」を一度忘れて、\n\n楽しめる工夫を\n\nひとつだけ考えてみてください。", "toi": "それを続けたいのは、何者かになりたいからなのか、ただ好きだからなのか。自分に正直に。", "sources": [{"media": "Amebloブログ", "date": "2025-04-08", "title": "４月８日　「三日坊主」にならない方法", "id": "20250408_01"}, {"media": "Amebloブログ", "date": "2026-03-31", "title": "何を始めても続かないと嘆いている人へ", "id": "20260331_01"}, {"media": "Amebloブログ", "date": "2026-05-26", "title": "続けられる自分になるために必要なこと", "id": "20260526_01"}]}, "q057": {"hitokoto": "自分を生きている、その輝きが意味", "body": "「何のために生きているのか、\n\nわからなくなる」\n\nそう感じる時が、\n\n誰にでもあるかもしれません。\n\n自然の中を見ると、\n\n長い年月を生きる種類もあれば、\n\n短い期間しか\n\n生きられないものもあります。\n\nでも、短いから意味がない、\n\nということはありませんよね。\n\n自然は、うまくやらなければとか、\n\n結果を出さなくちゃ、とは\n\n考えていません。\n\nただ「自分」を生きているだけ。\n\nその命の輝きこそが、\n\n＜生きる意味＞なのです。\n\n人間はつい考えてしまうので、\n\n意味のほうが\n\nわからなくなるのですね。\n\n今日は少しだけ、\n\n外の空気に触れてみてください。\n\n考えるのではなく感じる自分に、\n\nだんだん戻っていきます。", "toi": "意味を探しているのはアタマなのか、それともハートなのか。今日は、感じるほうに任せてみる。", "sources": [{"media": "Amebloブログ", "date": "2025-12-05", "title": "１２月５日　生きる意味がわからなくなる時", "id": "20251205_01"}, {"media": "Amebloブログ", "date": "2025-11-01", "title": "１１月１日　何も起こらない平凡な日々の意味", "id": "20251101_02"}, {"media": "Amebloブログ", "date": "2026-05-20", "title": "何に対して悩んでいるかわからない時", "id": "20260520_01"}]}, "q058": {"hitokoto": "使命は、外ではなく内側にあります", "body": "「自分の使命を、早く知りたい」\n\nそう思う気持ちは、\n\nとても真剣なものだと思います。\n\n多くの人は使命を\n\n「仕事」だと思っていますが、\n\n使命＝仕事ではないのです。\n\n使命とは、\n\n「自分の魂が喜ぶ生き方」のこと。\n\nだから外側で探していると、\n\n気づけば何年も\n\n経っていたりします。\n\n本当の使命は「To Do」ではなく\n\n「To Be」。\n\nやっていて当たり前の感覚、\n\n自分が喜びや幸せを感じる\n\n「ゆるぎない感覚」の中に、\n\n使命の核があったりします。\n\n今日は誰の評価も外して、\n\n自分が心地よかった瞬間を\n\nひとつ思い出してみてください。\n\n＜自分自身＞を生きることが、\n\nそのまま、あなたにしかできない\n\n役割になっていくのです。", "toi": "誰にも見られていないときでも、それでも続けてしまうこと。そこに魂の喜びが残っていないか。", "sources": [{"media": "Amebloブログ", "date": "2025-09-21", "title": "９月２１日　使命は魂が喜ぶ生き方をすること", "id": "20250921_02"}, {"media": "Amebloブログ", "date": "2025-12-04", "title": "１２月４日　あなたの使命は”生き様”にある", "id": "20251204_01"}, {"media": "Amebloブログ", "date": "2025-06-10", "title": "６月１０日　自分の使命は自分を生きれば果たされる", "id": "20250610_01"}]}, "q059": {"hitokoto": "止まっているのは人生ではなく、心", "body": "「人生が、止まっている気がする」\n\nそう感じると、\n\n場所を変えたい、人を変えたい、\n\nと思ってしまうものですよね。\n\nでも停滞の原因は、\n\n場所や人ではなく\n\n＜自分自身の心の状態＞\n\nだったりすることが\n\nほとんどなのです。\n\n人を優先する。\n\n自分を出してはいけない。\n\nそんなブレーキが\n\n利いているうちは、\n\n環境を変えても\n\n同じ現象がやってきます。\n\nそしてこのブレーキは、\n\n往々にして「愛されたくて」\n\n作ったもの。\n\nだから、責める必要はないのです。\n\n焦って現実を変えようとするより、\n\n今日の日常をひとつ\n\n味わってみてください。\n\n変えようとしなくなった時に、\n\n現実は動き出したりします。", "toi": "その場所を変えたい気持ちの下に、動けない自分への苛立ちがないか。静かに確かめてみる。", "sources": [{"media": "Amebloブログ", "date": "2025-05-19", "title": "５月１９日　人生が停滞していると感じた時にすべきこと", "id": "20250519_01"}, {"media": "Amebloブログ", "date": "2025-09-11", "title": "９月１１日　現実が変化するのは現実を変化させようとしなくなった時", "id": "20250911_01"}, {"media": "Amebloブログ", "date": "2025-11-01", "title": "１１月１日　何も起こらない平凡な日々の意味", "id": "20251101_02"}]}, "q060": {"hitokoto": "自由とは、選べるということなのです", "body": "「自由がない、と感じてしまう」\n\nそう思う時にはきっと、\n\nあれがあるから、\n\nこれから離れられないから、と\n\n自由ではない理由のほうが\n\n浮かんできますよね。\n\nでも本当の自由とは、\n\n物理的に拘束がないことではなく、\n\n「選択できること」なのです。\n\n今もし喜びを感じていないのなら、\n\nそれをやめる自由はあります。\n\nただ「やめてはいけない」と思って、\n\n自分を縛っているだけ\n\nかもしれません。\n\n「自由がない」のではなく、\n\n自分の思い通りに選ぶことを\n\n自分で却下している、\n\nということだったりします。\n\n今日はひとつだけ、\n\n小さなことを\n\n自分で選んでみてください。\n\n自由を許可すると、\n\n自由な環境のほうが\n\n近づいてきます。", "toi": "本当は選べるのに、選ばないでいることは何か。その選ばなさは、誰を守っているのか。", "sources": [{"media": "Amebloブログ", "date": "2026-01-22", "title": "自由ではないと感じる時に知ってほしいこと", "id": "20260122_01"}, {"media": "Amebloブログ", "date": "2026-02-10", "title": "自由を許可すると自由な環境がやってくる", "id": "20260210_01"}, {"media": "Amebloブログ", "date": "2024-11-09", "title": "１１月９日 大人になることは自由になること", "id": "20241109_01"}]}, "q061": {"hitokoto": "運は、意識の向け先で変わります", "body": "「わたしって、\n\nなんて運が悪いんだろう」\n\nそう感じる日が\n\n続くことがありますよね。\n\nでも、ずっと「運が悪い」と\n\n感じていると、\n\n本当にそのスパイラルに\n\n陥ってしまったりします。\n\n物事は、実際はニュートラル。\n\nひとつの方面から見たら不幸でも、\n\n別の側面から見ると、\n\n新しいきっかけを\n\nくれていることもあるのです。\n\n電車に乗り遅れた一本あとで、\n\n懐かしい人に会うこともある。\n\n「運」は文字通り、\n\n運ばれてくるもの。\n\nどこに意識を向けているかで\n\n変わっていくものだったりします。\n\n今日は、思い通りにいかなかった\n\n出来事の「よい方面」を\n\nひとつだけ探してみてください。\n\nそうやって意識を向けた先から、\n\n「運」のほうが動きはじめます。", "toi": "うまくいかなかったその出来事が、代わりに連れてきてくれたものは何か。ひとつ思い出してみる。", "sources": [{"media": "Amebloブログ", "date": "2026-06-08", "title": "運が悪いと嘆く前に知ってほしいこと", "id": "20260608_01"}, {"media": "Amebloブログ", "date": "2025-01-20", "title": "１月２０日　運がいい人と悪い人の違いは明確", "id": "20250120_02"}, {"media": "Amebloブログ", "date": "2025-10-15", "title": "１０月１５日　宿命と運命の違い＜運は意識によって作られる＞", "id": "20251015_01"}]}, "q062": {"hitokoto": "本当のスピリチュアルに、依存はない", "body": "「何年もやっているのに、\n\nどうして変わらないのか」\n\nそう思うこと、\n\nあるかもしれません。\n\nでもそれは、\n\nスピリチュアルのせいではないのです。\n\nスピリチュアルの世界にも\n\n「こうしなさい」を教える人がいて、\n\n親や学校からそう言われてきた人ほど、\n\nその教えを真面目に\n\n守ってしまうことがあります。\n\nでもそれでは、いつまでも\n\n「自分」を生きられないのですね。\n\n修行のように自分を制限すると、\n\nかえってエネルギーは下がります。\n\n本当のスピリチュアルには、\n\n依存がないのです。\n\nスピリチュアルは、\n\n誰かに従うためのものではなく、\n\n自分を生かすにはどうすればいいか、\n\nその調整のために使うもの。\n\n答えは、あなたの中にあります。", "toi": "これまで守ってきた教えのうち、自分のハートが本当にうなずいたものはどれか。選び直してみる。", "sources": [{"media": "Amebloブログ", "date": "2026-01-23", "title": "何年スピリチュアルをやっても結果が出ない理由", "id": "20260123_01"}, {"media": "Amebloブログ", "date": "2025-12-10", "title": "１２月１０日　スピリチュアルの使い道《魂のバージョンUPのはかりかた》", "id": "20251210_01"}, {"media": "Amebloブログ", "date": "2025-07-10", "title": "７月１０日　本当のスピリチュアルには依存がない", "id": "20250710_01"}]}, "q063": {"hitokoto": "願うより先に、今の自分を整える", "body": "「引き寄せをやっているのに、\n\nまったく叶う気配がない」\n\nそんなご相談は、\n\n本当によくあるのです。\n\n引き寄せの本質は\n\n「強く望むこと」ではなく、\n\n＜その現実にいる自分でいること＞\n\nだったりします。\n\n意識が「欲しい、欲しい」\n\n（まだ手に入っていません）なら、\n\nそのまま\n\n「手に入っていない現実」のほうが\n\n叶ってしまうのですね。\n\n言葉や思考よりも、\n\nどんなエネルギーの状態でいるかが、\n\n現実に影響を与えるのです。\n\nだから願うより先に、\n\n＜今の自分を整えること＞。\n\n今日は、今ある日常の中で\n\n「もう十分うれしいこと」を\n\nひとつ見つけてみてください。\n\nそれが一番の近道だったりします。", "toi": "叶えたいその願いは、叶ったらどんな気持ちを味わいたいのか。その気持ちは、今日も選べる。", "sources": [{"media": "Amebloブログ", "date": "2026-05-25", "title": "引き寄せの法則の本質とは", "id": "20260525_01"}, {"media": "Amebloブログ", "date": "2025-10-18", "title": "１０月１８日　引き寄せは「今ここ」の意識が叶える", "id": "20251018_01"}, {"media": "Amebloブログ", "date": "2025-09-11", "title": "９月１１日　現実が変化するのは現実を変化させようとしなくなった時", "id": "20250911_01"}]}, "q064": {"hitokoto": "感情が動いて、波動は上がります", "body": "「波動を上げなきゃ、\n\nと焦ってしまう」\n\nまじめな人ほど、\n\nそうなりやすいのです。\n\nでも波動を上げるとは、\n\nアタマでポジティブなことを\n\n考えることでも、\n\n「上がれ」と念じることでも\n\nありません。\n\n心が動いて、感情が動いて、\n\nはじめて波動は上がるのです。\n\n波動が下がるのは、\n\n自分が感じている「真」の感情を\n\n否定するから。\n\n怒っていてもいいのです。\n\n何も感じないよりも、\n\nずっと高いのですから。\n\nそして「上げなきゃ」と\n\n必死になっている時、その裏には\n\n「今の自分ではダメだ」が\n\n隠れていることもあります。\n\n今日は上げようとするのをやめて、\n\n子どもの頃に夢中になったことを\n\nひとつ思い出してみてください。", "toi": "波動を上げたいのは、今の自分を否定したいからなのか。その焦りごと、抱きしめてみる。", "sources": [{"media": "Amebloブログ", "date": "2024-02-26", "title": "２月２６日　波動を上げる前に必要なこと", "id": "20240226_01"}, {"media": "Amebloブログ", "date": "2025-10-12", "title": "１０月１２日　高い波動状態はこうやって作る", "id": "20251012_01"}, {"media": "Amebloブログ", "date": "2026-05-09", "title": "運気を上げるための活動＝「運活」に疲れた時に知ってほしいこと", "id": "20260509_01"}]}, "q065": {"hitokoto": "依存の下にあるのは、恐れなのです", "body": "「誰かや何かに依存してしまう\n\n自分が、嫌になる」\n\nそう自覚できているのなら、\n\nそこがもう突破口なのです。\n\n依存を起こすのは「恐れ」。\n\n無くなってしまう恐怖、\n\n変わってしまう恐怖、\n\n独りになってしまう恐怖。\n\nそんな恐怖感があるから、\n\n依存するしかなくなるのですね。\n\nだからアタマで\n\n「依存しないようにしよう」と\n\n言ったところで、\n\n心の中の恐怖感は\n\n消えることがありません。\n\n依存している自分を\n\n罰したり恥じたりするのではなく、\n\n「何を恐れているのか」の\n\nほうを見ていくといいのです。\n\n今日は責めるのを一度やめて、\n\nその恐れのほうに\n\n寄り添ってみてください。\n\n恐れは、思考が創り出した\n\nある種の幻想でもあるのです。", "toi": "その人やそれが無くなったら、いちばん困ることは何か。恐れているものの正体を、そっと見てみる。", "sources": [{"media": "Amebloブログ", "date": "2024-09-09", "title": "９月９日 依存はなぜ起こるのか", "id": "20240909_01"}, {"media": "Amebloブログ", "date": "2026-01-16", "title": "アルコール依存は心の中から改善する", "id": "20260116_02"}, {"media": "Amebloブログ", "date": "2025-07-10", "title": "７月１０日　本当のスピリチュアルには依存がない", "id": "20250710_01"}]}, "q066": {"hitokoto": "人間力は、代替えできないのです", "body": "「AIに仕事を\n\n奪われるのではないか」\n\nそんな不安を持つ人は、\n\n今とても多いと思います。\n\nでも、AIがいくら事務作業を\n\n効率よくこなしても、\n\n人を扱い、育て、面倒を見る\n\n「心」は持っていないのです。\n\n要するに「人間力」は\n\n代替えできないということ。\n\nこれからは逆に、\n\n人間の力のほうが\n\n大きく目立つようになります。\n\n感覚や感情を使って、\n\n自分のエネルギーを表現すること。\n\n個性を使って人生を切り開くことは、\n\n人間にしかできないことなのです。\n\n今日は、今いる場所、\n\n今携わっている仕事の中で、\n\n「自分」をひとつだけ\n\n出してみてください。\n\nやみくもに恐れなくていいのです。", "toi": "AIに置き換えられないのは、あなたのどんな部分なのか。今日の仕事の中で、探してみる。", "sources": [{"media": "Amebloブログ", "date": "2025-10-20", "title": "１０月２０日　AIに代替されないスキルは「人間力」", "id": "20251020_02"}, {"media": "Amebloブログ", "date": "2025-11-17", "title": "１１月１７日　AIが絶対に真似できない人間のスキル", "id": "20251117_01"}, {"media": "Amebloブログ", "date": "2025-08-26", "title": "８月２６日　AI時代に必ず必要になるスピリチュアルなセンス", "id": "20250826_01"}]}, "q067": {"hitokoto": "答えは、あなたの中で育つものです", "body": "「AIに悩みを話すことが、\n\n少し怖い」\n\nその感覚は、\n\nとても自然なものだと思います。\n\nAIは、あなたの感情に寄り添って、\n\n何かしら答えてくれるでしょう。\n\n今まで人に話せなかった人ほど、\n\nその共感に\n\n救われることもあります。\n\nそれは、とても良いことなのです。\n\nただ「よりよい生き方」や\n\n「根本的な解決法」までは、\n\nAIには答えられないところが\n\nあったりします。\n\n本当の共感は、言葉ではなく\n\n「響き合い」だから。\n\n呼吸と呼吸、鼓動と鼓動の合間の\n\n「あ・うん」のような感覚は、\n\n生身の人間のものなのですね。\n\nAIに話して楽になったあとに、\n\nその言葉を自分のハートにも\n\nもう一度、渡してみてください。", "toi": "AIの言葉に安心したあと、自分のハートは何と言っているのか。もう一度、聞き直してみる。", "sources": [{"media": "Amebloブログ", "date": "2026-03-02", "title": "AIのお悩み相談で可能なことと不可能なこと", "id": "20260302_01"}, {"media": "Amebloブログ", "date": "2025-08-30", "title": "８月３０日　AIには真似できない人間の響き合い", "id": "20250830_01"}, {"media": "Amebloブログ", "date": "2025-11-06", "title": "１１月６日　スピリチュアルな人ほどＡＩを上手に使いこなすことができる理由", "id": "20251106_01"}]}}};
</script>
<script>
(function(){
  const $=s=>document.querySelector(s);
  const cats=DATA.catalog.categories, items=DATA.catalog.items, answers=DATA.answers;
  const book=$('#book'), pl=$('#pl'), pr=$('#pr');
  let currentCat=null;

  function el(tag,cls,text){const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e;}
  function setPages(leftFn,rightFn,folioL,folioR){
    pl.innerHTML=''; pr.innerHTML='';
    leftFn(pl); rightFn(pr);
    pl.dataset.folio=folioL||''; pr.dataset.folio=folioR||'';
    [pl,pr].forEach(p=>{p.classList.remove('turn'); void p.offsetWidth; p.classList.add('turn'); p.addEventListener('animationend',()=>p.classList.remove('turn'),{once:true});});
    const y=book.getBoundingClientRect().top+window.scrollY-20;
    if(window.scrollY>y) window.scrollTo({top:y,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  }
  function tocList(list, arr, onPick, isItem){
    arr.forEach(c=>{
      const li=el('li'); const b=el('button'); b.type='button';
      b.appendChild(el('span','name',c.label||c.name));
      if(!isItem){ b.appendChild(el('span','hint', items.filter(i=>i.category===c.id).slice(0,2).map(i=>i.label.replace(/、/g,'')).join(' ／ ')+' など')); }
      b.addEventListener('click',()=>onPick(c.id));
      li.appendChild(b); list.appendChild(li);
    });
  }
  // ---- TOC spread ----
  function showToc(){
    setPages(p=>{
      p.appendChild(el('p','kicker','目次'));
      p.appendChild(el('h2','ptitle','どんなことで、迷っていますか'));
      p.appendChild(el('p','plead','いま抱えている悩みに近いものをひらくと、みちよの言葉と、あなたが自分で考えるための「問い」のページに進みます。'));
      const ul=el('ul','toc'); tocList(ul,cats.slice(0,6),openCat); p.appendChild(ul);
    }, p=>{
      p.appendChild(el('p','kicker','目次'));
      const ul=el('ul','toc'); tocList(ul,cats.slice(6),openCat); p.appendChild(ul);
      const lk=el('div','links'); const r=el('button','textlink','選べないときは、ひとつ引く'); r.type='button'; r.addEventListener('click',random); lk.appendChild(r); p.appendChild(lk);
    },'一','二');
  }
  // ---- items spread ----
  function openCat(id){
    currentCat=cats.find(c=>c.id===id);
    const list=items.filter(i=>i.category===id);
    const half=Math.ceil(list.length/2);
    setPages(p=>{
      const b=el('button','back','← 目次にもどる'); b.type='button'; b.addEventListener('click',showToc); p.appendChild(b);
      p.appendChild(el('p','kicker','悩みをえらぶ'));
      p.appendChild(el('h2','ptitle',currentCat.name));
      p.appendChild(el('p','plead','いちばん近いものを、ひらいてください。'));
      const ul=el('ul','toc items'); tocList(ul,list.slice(0,half),openAns,true); p.appendChild(ul);
    }, p=>{
      p.appendChild(el('p','kicker',currentCat.name+'　つづき'));
      const ul=el('ul','toc items'); tocList(ul,list.slice(half),openAns,true); p.appendChild(ul);
      const lk=el('div','links'); const r=el('button','textlink','選べないときは、ひとつ引く'); r.type='button'; r.addEventListener('click',random); lk.appendChild(r); p.appendChild(lk);
    },'三','四');
  }
  // ---- answer spread ----
  function openAns(id){
    const it=items.find(i=>i.id===id), a=answers[id]; if(!it||!a) return;
    currentCat=cats.find(c=>c.id===it.category);
    setPages(p=>{
      const b=el('button','back','← 一覧にもどる'); b.type='button'; b.addEventListener('click',()=>openCat(currentCat.id)); p.appendChild(b);
      const ch=el('div','chosen'); ch.appendChild(el('p','lab','あなたがひらいたこと')); ch.appendChild(el('p','q','「'+it.label+'」')); p.appendChild(ch);
      p.appendChild(el('h2','hitokoto',a.hitokoto));
      const body=el('div','body');
      const lines=a.body.replace(/\r/g,'').split('\n').map(s=>s.trim()).filter(Boolean);
      let cur=[]; const paras=[];
      lines.forEach(l=>{ cur.push(l); if(/[。」]$/.test(l)||/＾＾$/.test(l)){paras.push(cur);cur=[];} });
      if(cur.length) paras.push(cur);
      paras.forEach(par=>{ const pe=el('p'); par.forEach((line,j)=>{ if(j) pe.appendChild(el('br')); pe.appendChild(document.createTextNode(line)); }); body.appendChild(pe); });
      p.appendChild(body);
      p.appendChild(el('p','sign','── みちよ'));
    }, p=>{
      p.appendChild(el('p','kicker','自分で考える問い'));
      const tw=el('div','toi-wrap');
      tw.appendChild(el('p','toi-text',a.toi));
      tw.appendChild(el('p','toi-after','答えは急がなくて、いいのです。この問いを、しばらく持ち歩いてみてください。答えは、あなたの中に。'));
      p.appendChild(tw);
      const src=el('div','src'); src.appendChild(el('h3',null,'この言葉のもと'));
      const ul=el('ul'); (a.sources||[]).forEach(s=>{const li=el('li'); li.appendChild(el('span',null,s.media+' '+s.date)); li.appendChild(document.createTextNode(' 「'+s.title+'」')); ul.appendChild(li);}); src.appendChild(ul); p.appendChild(src);
      const lk=el('div','links');
      const b1=el('button','textlink','別の悩みをひらく'); b1.type='button'; b1.addEventListener('click',showToc);
      const b2=el('button','textlink','もうひとつ引く'); b2.type='button'; b2.addEventListener('click',random);
      lk.appendChild(b1); lk.appendChild(b2); p.appendChild(lk);
    },'五','六');
    history.replaceState(null,'','#'+id);
  }
  function random(){ openAns(items[Math.floor(Math.random()*items.length)].id); }

  function open(){ if(book.classList.contains('opened')) return; book.classList.add('opened'); }
  $('#cover').addEventListener('click',()=>{ open(); showToc(); });

  const h=location.hash.replace('#','');
  if(h&&answers[h]){ open(); openAns(h); }

  // footer
  $('#about').textContent=CONFIG.aboutText; $('#help').textContent=CONFIG.helpText;
  const links=$('#links'); let any=false;
  [['substackUrl','substackLabel'],['portalUrl','portalLabel'],['privacyUrl','privacyLabel']].forEach(([u,l])=>{ if(CONFIG[u]){const a=el('a',null,CONFIG[l]); a.href=CONFIG[u]; a.rel='noopener'; links.appendChild(a); any=true;} });
  $('#quiet').textContent=any?CONFIG.quietText:''; $('#quiet').hidden=!any;

  // watercolor wash

  const seed=[[0.15,0.15,0.42,'a'],[0.88,0.28,0.36,'b'],[0.6,0.8,0.40,'a'],[0.08,0.85,0.30,'b']];
  function blob(cx,cy,r,k,ph){ctx.beginPath();const n=14;for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;const wob=1+0.14*Math.sin(a*3+ph+k)+0.09*Math.cos(a*5-ph*0.7+k*2);const x=cx+Math.cos(a)*r*wob,y=cy+Math.sin(a)*r*wob*0.86;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();}

    seed.forEach((s,i)=>{const ph=t*0.0025+i;const r=Math.max(W,H)*s[2]*(1+0.03*Math.sin(ph));const cx=s[0]*W+Math.sin(ph*0.6)*W*0.012,cy=s[1]*H+Math.cos(ph*0.5)*H*0.012;const g=ctx.createRadialGradient(cx,cy,r*0.1,cx,cy,r);g.addColorStop(0,`rgba(${cols[s[3]]},${alpha})`);g.addColorStop(0.7,`rgba(${cols[s[3]]},${alpha*0.45})`);g.addColorStop(1,`rgba(${cols[s[3]]},0)`);ctx.fillStyle=g;blob(cx,cy,r,i*1.7,ph);ctx.fill();ctx.strokeStyle=`rgba(${cols[s[3]]},${alpha*0.35})`;ctx.lineWidth=1.2;ctx.stroke();});
    t+=1; if(!reduce) requestAnimationFrame(draw);}
  draw();
})();
